<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColorMeta" content="">
<title>Home | Luy Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro",
          "SF Pro Display", "Inter", "Noto Sans Khmer", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro",
          "SF Pro Text", "Inter", "Noto Sans Khmer", system-ui, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont,
          "SF Pro Display", "SF Pro", "Inter", "Noto Sans Khmer", system-ui,
          sans-serif;
  --page: #f2f2f7;
  --surface: #ffffff;
  --surface-low: #f2f2f7;
  --surface-mid: #e9e9ee;
  --fill: #ececf0;
  --track: #e5e5ea;
  --border: #c6c6c8;
  --hairline: #d9d9de;
  --card-edge: transparent;
  --ink: #000000;
  --ink-muted: #5f5f65;
  --ink-faint: #67676c;
  --brand: #056963;
  --brand-strong: #04524e;
  --brand-soft: #e2f2ef;
  --inflow: #1a7f45;
  --inflow-soft: #e4f4ea;
  --outflow: #c72f24;
  --outflow-soft: #fdebe9;
  --warning: #9a5b00;
  --warning-soft: #fdf1d9;
  --usd: #2f6fb0;
  --usd-soft: #e6f0fb;
  --khr: #9a580b;
  --khr-soft: #fbefdc;
  --hero: #0f3338;
  --hero-2: #0a4b49;
  --on-hero: #ffffff;
  --hero-usd: #8fc4f0;
  --hero-khr: #f0bd75;
  --on-action: #ffffff;
  --chart-1: #06756f;
  --chart-2: #2f6fb0;
  --chart-3: #c07a1c;
  --chart-4: #7a55c7;
  --chart-5: #c72f24;
  --chart-6: #1a7f45;
  --chart-other: #8e8e93;
  --material: color-mix(in srgb, var(--surface) 72%, transparent);
  --material-thick: color-mix(in srgb, var(--surface) 88%, transparent);
  --material-sheet: color-mix(in srgb, var(--surface) 94%, transparent);
  --glass: color-mix(in srgb, var(--surface) 58%, transparent);
  --glass-border: rgb(255 255 255 / 0.55);
  --glass-highlight: inset 0 1px 0 rgb(255 255 255 / 0.6),
                     inset 0 -1px 0 rgb(0 0 0 / 0.04);
  --glass-blur: saturate(190%) blur(24px);
  --scrim: rgb(0 0 0 / 0.32);
  --shadow-float: 0 8px 28px rgb(0 0 0 / 0.14), 0 0 0 0.5px rgb(0 0 0 / 0.06);
  --shadow-thumb: 0 1px 3px rgb(0 0 0 / 0.12), 0 0 0 0.5px rgb(0 0 0 / 0.04);
  --r-hero: 32px;
  --r-card: 26px;
  --r-control: 12px;
  --r-key: 999px;
  --r-tile: 10px;
  --r-pill: 999px;
  --gutter: 16px;
  --card-pad: 20px;
  --ease-spring: cubic-bezier(0.32, 0.72, 0, 1);
  --dur-push: 380ms;
  --dur-sheet: 420ms;
  --dur-seg: 260ms;
  --dur-fade: 160ms;
  --dur-release: 260ms;
  --dur-chart: 400ms;
}

@media (max-width: 379px) {
  :root {
    --gutter: 16px;
    --card-pad: 16px;
  }
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #000000;
    --surface: #1c1c1e;
    --surface-low: #2c2c2e;
    --surface-mid: #3a3a3c;
    --fill: #2c2c2e;
    --track: #3a3a3c;
    --border: #48484a;
    --hairline: #38383a;
    --card-edge: rgb(255 255 255 / 0.06);
    --ink: #ffffff;
    --ink-muted: #a1a1a8;
    --ink-faint: #95959a;
    --brand: #40c8b8;
    --brand-strong: #63d6c8;
    --brand-soft: #103835;
    --inflow: #30d158;
    --inflow-soft: #12331c;
    --outflow: #ff6961;
    --outflow-soft: #3d1a18;
    --warning: #ffb340;
    --warning-soft: #3a2a0c;
    --usd: #64a8f0;
    --usd-soft: #142b44;
    --khr: #f0aa55;
    --khr-soft: #3a2810;
    --hero: #0e2f33;
    --hero-2: #0a4442;
    --on-hero: #ffffff;
    --hero-usd: #8fc4f0;
    --hero-khr: #f0bd75;
    --on-action: #00201d;
    --chart-1: #40c8b8;
    --chart-2: #64a8f0;
    --chart-3: #f0aa55;
    --chart-4: #b08cf0;
    --chart-5: #ff6961;
    --chart-6: #30d158;
    --chart-other: #8e8e93;
    --material-sheet: color-mix(in srgb, var(--surface-low) 94%, transparent);
    --glass-border: rgb(255 255 255 / 0.14);
    --glass-highlight: inset 0 1px 0 rgb(255 255 255 / 0.16),
                       inset 0 -1px 0 rgb(0 0 0 / 0.3);
    --scrim: rgb(0 0 0 / 0.5);
    --shadow-float: 0 8px 28px rgb(0 0 0 / 0.5), 0 0 0 0.5px rgb(255 255 255 / 0.1);
    --shadow-thumb: 0 1px 3px rgb(0 0 0 / 0.4);
  }
}

:root[data-theme="dark"] {
  --page: #000000;
  --surface: #1c1c1e;
  --surface-low: #2c2c2e;
  --surface-mid: #3a3a3c;
  --fill: #2c2c2e;
  --track: #3a3a3c;
  --border: #48484a;
  --hairline: #38383a;
  --card-edge: rgb(255 255 255 / 0.06);
  --ink: #ffffff;
  --ink-muted: #a1a1a8;
  --ink-faint: #95959a;
  --brand: #40c8b8;
  --brand-strong: #63d6c8;
  --brand-soft: #103835;
  --inflow: #30d158;
  --inflow-soft: #12331c;
  --outflow: #ff6961;
  --outflow-soft: #3d1a18;
  --warning: #ffb340;
  --warning-soft: #3a2a0c;
  --usd: #64a8f0;
  --usd-soft: #142b44;
  --khr: #f0aa55;
  --khr-soft: #3a2810;
  --hero: #0e2f33;
  --hero-2: #0a4442;
  --on-hero: #ffffff;
  --hero-usd: #8fc4f0;
  --hero-khr: #f0bd75;
  --on-action: #00201d;
  --chart-1: #40c8b8;
  --chart-2: #64a8f0;
  --chart-3: #f0aa55;
  --chart-4: #b08cf0;
  --chart-5: #ff6961;
  --chart-6: #30d158;
  --chart-other: #8e8e93;
  --material-sheet: color-mix(in srgb, var(--surface-low) 94%, transparent);
  --glass-border: rgb(255 255 255 / 0.14);
  --glass-highlight: inset 0 1px 0 rgb(255 255 255 / 0.16),
                     inset 0 -1px 0 rgb(0 0 0 / 0.3);
  --scrim: rgb(0 0 0 / 0.5);
  --shadow-float: 0 8px 28px rgb(0 0 0 / 0.5), 0 0 0 0.5px rgb(255 255 255 / 0.1);
  --shadow-thumb: 0 1px 3px rgb(0 0 0 / 0.4);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-push: 0ms;
    --dur-sheet: 0ms;
    --dur-seg: 0ms;
    --dur-fade: 0ms;
    --dur-release: 0ms;
    --dur-chart: 0ms;
  }
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-optical-sizing: auto;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body.sheet-scroll-lock {
  position: fixed;
  left: 0;
  right: 0;
  overflow: hidden;
  background: var(--page);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

svg text {
  font-family: var(--font);
  letter-spacing: 0;
}

button, input, a, [role="button"], [tabindex="0"] {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

button {
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
}

button:disabled {
  cursor: default;
}

a {
  color: inherit;
  text-decoration: none;
}

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.sheet-panel:focus {
  outline: none;
}

.sheet-panel:focus-visible {
  outline: none;
}

.tabular {
  font-variant-numeric: tabular-nums;
}

.font-num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* Pass 4 type scale */
.t-large-title {
  font-family: var(--font-display);
  font-size: 34px;
  line-height: 41px;
  font-weight: 700;
  letter-spacing: 0.011em;
}

.t-title-2 {
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 28px;
  font-weight: 700;
  letter-spacing: 0.012em;
}

.t-title-3 {
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 25px;
  font-weight: 700;
  letter-spacing: 0.012em;
}

.t-headline {
  font-size: 17px;
  line-height: 22px;
  font-weight: 600;
  letter-spacing: -0.025em;
}

.t-body {
  font-size: 17px;
  line-height: 22px;
  font-weight: 400;
  letter-spacing: -0.025em;
}

.t-callout {
  font-size: 16px;
  line-height: 21px;
  font-weight: 400;
  letter-spacing: -0.014em;
}

.t-subhead {
  font-size: 15px;
  line-height: 20px;
  font-weight: 400;
  letter-spacing: -0.014em;
}

.t-footnote {
  font-size: 13px;
  line-height: 18px;
  font-weight: 400;
  letter-spacing: -0.006em;
}

.t-caption {
  font-size: 12px;
  line-height: 16px;
  font-weight: 400;
  letter-spacing: 0;
}

.t-caption-2 {
  font-size: 11px;
  line-height: 13px;
  font-weight: 500;
  letter-spacing: 0;
}

.caption {
  font-size: 13px;
  line-height: 18px;
  font-weight: 400;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
}

.settings-group-header {
  font-size: 13px;
  line-height: 18px;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
  padding: 0 16px 6px;
}

.settings-group-footer {
  font-size: 13px;
  line-height: 18px;
  font-weight: 400;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
  padding: 6px 16px 0;
}

.numeric-lg {
  font-family: var(--font-num);
  font-size: 20px;
  line-height: 25px;
  font-weight: 600;
  letter-spacing: 0.012em;
  font-variant-numeric: tabular-nums;
}

.numeric-md {
  font-family: var(--font-num);
  font-size: 16px;
  line-height: 21px;
  font-weight: 600;
  letter-spacing: -0.014em;
  font-variant-numeric: tabular-nums;
}

/* App shell & sheet background scale */
.app-shell {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--page);
  transition: transform var(--dur-sheet) var(--ease-spring), border-radius var(--dur-sheet) var(--ease-spring);
  will-change: transform;
}

.app-shell.is-sheet-behind {
  transform: translateY(10px) scale(0.93);
  border-radius: 12px;
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce) {
  .app-shell.is-sheet-behind {
    transform: none;
    border-radius: 0;
  }
}

.sidebar {
  display: none;
}

.main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Scroll edge fade & floating phone bar controls */
.scroll-edge {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: calc(64px + env(safe-area-inset-top));
  z-index: 19;
  pointer-events: none;
  opacity: 0;
  background: color-mix(in srgb, var(--page) 85%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  mask-image: linear-gradient(to bottom, rgb(0 0 0 / 1) 0%, rgb(0 0 0 / 0) 100%);
  -webkit-mask-image: linear-gradient(to bottom, rgb(0 0 0 / 1) 0%, rgb(0 0 0 / 0) 100%);
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: calc(44px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) var(--gutter) 0 var(--gutter);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  background: transparent;
  pointer-events: none;
}

.topbar > * {
  pointer-events: auto;
}

.topbar-left {
  display: flex;
  align-items: center;
  justify-self: start;
  min-width: 0;
}

.topbar-inline-title {
  font-size: 17px;
  line-height: 22px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50vw;
  opacity: 0;
  transition: opacity var(--dur-fade) ease;
  justify-self: center;
  pointer-events: none;
}

.topbar.is-scrolled .topbar-inline-title {
  opacity: 1;
}

.topbar-actions {
  display: flex;
  align-items: center;
  justify-self: end;
  gap: 8px;
}

.icon-btn {
  width: 44px;
  height: 44px;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  background: var(--glass);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-highlight), var(--shadow-float);
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

@supports not (backdrop-filter: blur(1px)) {
  .icon-btn {
    background: var(--material-thick);
  }
}

.icon-btn:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover {
    filter: brightness(1.04);
  }
}

.main-content {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: calc(44px + env(safe-area-inset-top) + 8px) var(--gutter) calc(110px + env(safe-area-inset-bottom));
}

.screen-head-flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 4px;
}

.large-title-h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 34px;
  line-height: 41px;
  font-weight: 700;
  letter-spacing: 0.011em;
  color: var(--ink);
}

.desktop-head-actions {
  display: none;
}

.screen-view {
  animation: screenFade var(--dur-fade) ease;
}

.screen-view.is-push-in {
  animation: pushSlideIn var(--dur-push) var(--ease-spring);
}

.screen-view.is-pop-in {
  animation: popSlideIn var(--dur-push) var(--ease-spring);
}

.push-ghost {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 15;
  pointer-events: none;
  background: var(--page);
  padding: calc(44px + env(safe-area-inset-top) + 8px) var(--gutter) 40px;
  animation: pushGhostOut var(--dur-push) var(--ease-spring) forwards;
}

.push-ghost.is-pop-out {
  z-index: 25;
  animation: popGhostOut var(--dur-push) var(--ease-spring) forwards;
}

@keyframes screenFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes pushSlideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

@keyframes pushGhostOut {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(-30%); opacity: 0.45; }
}

@keyframes popSlideIn {
  from { transform: translateX(-30%); opacity: 0.45; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes popGhostOut {
  from { transform: translateX(0); }
  to { transform: translateX(100%); }
}

@keyframes thumbStretch {
  0% { scale: 1 1; }
  50% { scale: 1.06 1; }
  100% { scale: 1 1; }
}

@media (prefers-reduced-motion: reduce) {
  .screen-view,
  .screen-view.is-push-in,
  .screen-view.is-pop-in {
    animation: none;
  }
  .push-ghost {
    display: none;
  }
}

.stack-16 {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Section headers outside cards */
.sec-wrap {
  margin-top: 30px;
}

.sec-wrap:first-child {
  margin-top: 0;
}

.sec-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 0 4px;
  margin-bottom: 8px;
}

.sec-title {
  margin: 0;
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 25px;
  font-weight: 700;
  letter-spacing: 0.012em;
  color: var(--ink);
}

.text-link {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 4px;
  margin: -10px -4px;
  font-size: 15px;
  line-height: 20px;
  font-weight: 400;
  letter-spacing: -0.014em;
  color: var(--brand);
  transition: opacity var(--dur-fade) ease;
}

.text-link:active {
  opacity: 0.55;
}

/* Borderless, shadowless cards and list groups */
.card {
  background: var(--surface);
  border-radius: var(--r-card);
  border: 0.5px solid var(--card-edge);
  padding: var(--card-pad);
}

.group-card {
  background: var(--surface);
  border-radius: var(--r-card);
  border: 0.5px solid var(--card-edge);
  overflow: hidden;
}

/* Floating tab capsule and Add button (phone) */
.floating-dock {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: max(12px, env(safe-area-inset-bottom));
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}

.tab-capsule {
  pointer-events: auto;
  position: relative;
  flex: 1;
  max-width: 420px;
  height: 64px;
  padding: 4px;
  border-radius: var(--r-pill);
  background: var(--glass);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-highlight), var(--shadow-float);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: stretch;
  transition: height 300ms var(--ease-spring);
}

@supports not (backdrop-filter: blur(1px)) {
  .tab-capsule {
    background: var(--material-thick);
  }
}

.tab-indicator {
  position: absolute;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc((100% - 8px) / 4);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--brand) 14%, transparent);
  transition: transform var(--dur-seg) var(--ease-spring), opacity var(--dur-fade) ease;
  pointer-events: none;
}

.tab-indicator.is-stretching,
.seg-thumb.is-stretching,
.hero-seg-thumb.is-stretching {
  animation: thumbStretch var(--dur-seg) var(--ease-spring);
}

@media (prefers-reduced-motion: reduce) {
  .tab-indicator.is-stretching,
  .seg-thumb.is-stretching,
  .hero-seg-thumb.is-stretching {
    animation: none;
  }
}

.bnav-item {
  position: relative;
  z-index: 1;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--ink-muted);
  font-size: 10px;
  line-height: 12px;
  letter-spacing: 0;
  font-weight: 500;
  white-space: nowrap;
  transition: color var(--dur-fade) ease, gap 300ms var(--ease-spring);
}

.bnav-item span {
  transition: opacity 180ms ease, max-height 300ms var(--ease-spring);
  max-height: 14px;
  overflow: hidden;
}

.bnav-item[aria-current="page"] {
  color: var(--brand);
  font-weight: 600;
}

.dock-add-btn {
  pointer-events: auto;
  width: 64px;
  height: 64px;
  flex-shrink: 0;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--brand) 88%, transparent);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-highlight), var(--shadow-float);
  color: var(--on-action);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  scale: 1;
  transition: width 300ms var(--ease-spring), height 300ms var(--ease-spring), scale 350ms var(--ease-spring), filter 350ms var(--ease-spring), background-color var(--dur-fade) ease;
}

@supports not (backdrop-filter: blur(1px)) {
  .dock-add-btn {
    background: var(--brand);
  }
}

.dock-add-btn:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

@media (hover: hover) and (pointer: fine) {
  .dock-add-btn:hover {
    background: color-mix(in srgb, var(--brand-strong) 92%, transparent);
  }
}

.floating-dock.is-collapsed .tab-capsule {
  height: 52px;
}

.floating-dock.is-collapsed .dock-add-btn {
  width: 52px;
  height: 52px;
}

.floating-dock.is-collapsed .bnav-item {
  gap: 0;
}

.floating-dock.is-collapsed .bnav-item span {
  opacity: 0;
  max-height: 0;
}

@media (prefers-reduced-motion: reduce) {
  .tab-capsule,
  .dock-add-btn,
  .bnav-item,
  .bnav-item span {
    transition: none;
  }
}

/* Two pockets hero */
.hero-panel {
  background:
    radial-gradient(ellipse 65% 60% at 0% 0%, rgb(255 255 255 / 0.10) 0%, transparent 100%),
    linear-gradient(145deg, var(--hero), var(--hero-2));
  color: var(--on-hero);
  border-radius: var(--r-hero);
  box-shadow: inset 0 0 0 0.5px rgb(255 255 255 / 0.12);
  padding: 20px;
}

.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.hero-label {
  font-size: 13px;
  line-height: 18px;
  font-weight: 400;
  letter-spacing: -0.006em;
  color: color-mix(in srgb, var(--on-hero) 75%, transparent);
}

.hero-top-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.hero-eye-btn {
  width: 44px;
  height: 44px;
  margin: -6px 0;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: color-mix(in srgb, var(--on-hero) 85%, transparent);
  transition: opacity var(--dur-fade) ease;
}

.hero-eye-btn:active {
  opacity: 0.6;
}

.hero-seg {
  position: relative;
  height: 32px;
  padding: 2px;
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--on-hero) 14%, transparent);
  display: inline-grid;
  grid-template-columns: repeat(2, 1fr);
  align-items: center;
}

.hero-seg-thumb {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  width: calc((100% - 4px) / 2);
  border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--on-hero) 26%, transparent);
  transition: transform var(--dur-seg) var(--ease-spring);
  pointer-events: none;
}

.hero-seg button {
  position: relative;
  z-index: 1;
  min-width: 44px;
  height: 28px;
  padding: 0 10px;
  font-size: 13px;
  letter-spacing: -0.006em;
  font-weight: 500;
  color: color-mix(in srgb, var(--on-hero) 85%, transparent);
}

.hero-seg button::before {
  content: "";
  position: absolute;
  inset: -8px 0;
}

.hero-seg button[aria-pressed="true"] {
  font-weight: 600;
  color: var(--on-hero);
}

.hero-total-wrap {
  margin-top: 10px;
}

.hero-figure {
  font-family: var(--font-num);
  font-size: clamp(32px, 10.2vw, 52px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: 0.011em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.hero-sub {
  margin-top: 4px;
  font-size: 15px;
  line-height: 20px;
  letter-spacing: -0.014em;
  color: color-mix(in srgb, var(--on-hero) 75%, transparent);
  font-variant-numeric: tabular-nums;
}

.pocket-bar {
  margin-top: 16px;
  height: 8px;
  border-radius: var(--r-pill);
  display: flex;
  gap: 3px;
  overflow: hidden;
  background: color-mix(in srgb, var(--on-hero) 12%, transparent);
}

.pocket-seg {
  height: 100%;
  border-radius: var(--r-pill);
  transition: width var(--dur-chart) var(--ease-spring);
}

.pocket-seg-usd { background: var(--hero-usd); }
.pocket-seg-khr { background: var(--hero-khr); }

.pocket-tiles {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.pocket-tile {
  text-align: left;
  background: rgb(255 255 255 / 0.12);
  border: 0.5px solid rgb(255 255 255 / 0.18);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.22);
  border-radius: 16px;
  padding: 12px 14px;
  min-height: 44px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 3px;
  color: var(--on-hero);
  transition: background-color var(--dur-fade) ease;
}

.pocket-tile:active {
  background: rgb(255 255 255 / 0.20);
}

@media (hover: hover) and (pointer: fine) {
  .pocket-tile:hover {
    background: rgb(255 255 255 / 0.17);
  }
}

.pocket-tile-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  font-weight: 500;
  color: color-mix(in srgb, var(--on-hero) 88%, transparent);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  flex-shrink: 0;
  display: inline-block;
}

.dot-usd { background: var(--hero-usd); }
.dot-khr { background: var(--hero-khr); }
.dot-usd-ink { background: var(--usd); }
.dot-khr-ink { background: var(--khr); }

.pocket-tile-val {
  font-family: var(--font-num);
  font-size: clamp(16px, 5vw, 20px);
  line-height: 24px;
  letter-spacing: -0.014em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.pocket-tile-cap {
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  color: color-mix(in srgb, var(--on-hero) 86%, transparent);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.hero-rate-wrap {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 0.5px solid color-mix(in srgb, var(--on-hero) 18%, transparent);
}

.hero-rate-btn {
  width: 100%;
  min-height: 44px;
  padding: 6px 4px;
  margin: -6px -4px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  color: var(--on-hero);
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  text-align: left;
  transition: opacity var(--dur-fade) ease;
}

.hero-rate-btn:active {
  opacity: 0.65;
}

.hero-rate-left {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.hero-rate-val {
  font-family: var(--font-num);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.hero-rate-meta {
  color: color-mix(in srgb, var(--on-hero) 75%, transparent);
  font-size: 12px;
  letter-spacing: 0;
}

.hero-rate-stale {
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border-radius: var(--r-pill);
  background: var(--warning-soft);
  color: var(--warning);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
  letter-spacing: -0.006em;
  font-weight: 500;
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.hero-rate-stale:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.hero-rate-stale-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.hero-rate-stale-act {
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

/* Add again horizontal strip */
.chip-scroll {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  margin-inline: calc(var(--gutter) * -1);
  padding-inline: var(--gutter);
  padding-block: 4px;
}

.chip-scroll::-webkit-scrollbar {
  display: none;
}

.chip-scroll > * {
  scroll-snap-align: start;
  flex-shrink: 0;
}

.add-again-chip {
  height: 52px;
  padding: 6px 14px 6px 10px;
  border-radius: 18px;
  background: var(--surface);
  border: 0.5px solid var(--card-edge);
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  scale: 1;
  transition: background-color var(--dur-release) ease, scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.add-again-chip:active {
  background: var(--surface-mid);
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

@media (hover: hover) and (pointer: fine) {
  .add-again-chip:hover {
    background: var(--surface-mid);
  }
}

.add-again-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--r-tile);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.add-again-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.add-again-note {
  font-size: 14px;
  line-height: 18px;
  letter-spacing: -0.006em;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
}

.add-again-amt {
  font-family: var(--font-num);
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  font-weight: 500;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Month header outside card & chart */
.month-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.month-head-left {
  display: flex;
  align-items: center;
  gap: 2px;
}

.stepper-btn {
  width: 44px;
  height: 44px;
  margin: -8px 0;
  border-radius: var(--r-pill);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--brand);
  transition: opacity var(--dur-fade) ease;
}

.stepper-btn:active:not(:disabled) {
  opacity: 0.55;
}

.stepper-btn:disabled {
  color: var(--ink-faint);
  opacity: 0.35;
}

.month-figures {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.month-fig-label {
  display: block;
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
  margin-bottom: 2px;
}

.month-fig-val {
  font-family: var(--font-num);
  font-size: clamp(14px, 4.3vw, 17px);
  line-height: 22px;
  letter-spacing: -0.014em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  display: block;
}

.val-inflow { color: var(--inflow); }
.val-outflow { color: var(--outflow); }

.month-note {
  margin-top: 8px;
}

.chart-callout {
  margin-top: 14px;
  margin-bottom: 8px;
}

.chart-callout-label {
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  color: var(--ink-muted);
}

.chart-callout-val {
  font-family: var(--font-num);
  font-size: 20px;
  line-height: 25px;
  letter-spacing: 0.012em;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.daily-chart-wrap {
  position: relative;
}

.daily-bars {
  position: relative;
  height: 76px;
  display: grid;
  grid-template-columns: repeat(30, minmax(0, 1fr));
  gap: 3px;
  align-items: end;
  touch-action: pan-y;
}

.daily-bar-btn {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 0;
  border-radius: 3px;
}

.daily-bar-fill {
  width: 100%;
  border-radius: 3px;
  background: color-mix(in srgb, var(--brand) 35%, transparent);
  transition: height var(--dur-chart) var(--ease-spring), background-color var(--dur-fade) ease;
}

.daily-bar-btn.is-selected .daily-bar-fill {
  background: var(--brand);
}

.daily-bar-btn.is-capped .daily-bar-fill {
  background: linear-gradient(to bottom, color-mix(in srgb, var(--brand) 35%, transparent) 0 7px, transparent 7px 10px, color-mix(in srgb, var(--brand) 35%, transparent) 10px);
}

.daily-bar-btn.is-capped.is-selected .daily-bar-fill {
  background: linear-gradient(to bottom, var(--brand) 0 7px, transparent 7px 10px, var(--brand) 10px);
}

.daily-bar-btn.is-future .daily-bar-fill {
  height: 3px !important;
  background: var(--track);
}

.daily-bar-btn.is-zero .daily-bar-fill {
  background: var(--track);
}

.daily-today-dot {
  width: 4px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--brand);
  margin-bottom: 3px;
}

.daily-typical-line {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px dashed var(--ink-muted);
  pointer-events: none;
}

.daily-typical-label {
  position: absolute;
  right: 0;
  top: -17px;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  font-weight: 400;
  color: var(--ink-muted);
  background: var(--surface);
  padding-left: 4px;
  font-variant-numeric: tabular-nums;
}

.empty-month-chart {
  margin-top: 14px;
  padding: 16px 14px;
  border-radius: var(--r-control);
  background: var(--surface-low);
  text-align: center;
  color: var(--ink-muted);
  font-size: 13px;
  letter-spacing: -0.006em;
}

/* Budgets strip and cards */
.budget-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.budget-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.budget-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.budget-id {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.row-icon-tile {
  width: 36px;
  height: 36px;
  border-radius: var(--r-tile);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.budget-name {
  font-size: 16px;
  line-height: 21px;
  letter-spacing: -0.014em;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.budget-nums {
  flex-shrink: 0;
  font-family: var(--font-num);
  font-size: 14px;
  line-height: 20px;
  letter-spacing: -0.006em;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.budget-track-wrap {
  position: relative;
  height: 12px;
  display: flex;
  align-items: center;
}

.budget-track {
  width: 100%;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--track);
  overflow: hidden;
}

.budget-fill {
  height: 100%;
  border-radius: var(--r-pill);
  transition: width var(--dur-chart) var(--ease-spring);
}

.budget-fill.is-ok { background: var(--brand); }
.budget-fill.is-warn { background: var(--warning); }
.budget-fill.is-over { background: var(--outflow); }

.budget-pace-tick {
  position: absolute;
  top: 0;
  width: 2px;
  height: 12px;
  border-radius: 1px;
  background: var(--ink);
  transform: translateX(-1px);
}

.budget-summary-card {
  display: flex;
  align-items: center;
  gap: 18px;
}

.ring-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  flex-shrink: 0;
}

.ring-wrap svg {
  width: 100%;
  height: 100%;
  display: block;
}

@media (max-width: 359px) {
  .ring-wrap {
    width: 96px;
    height: 96px;
  }
  .budget-summary-card {
    gap: 14px;
  }
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}

.ring-pct {
  font-family: var(--font-num);
  font-size: 22px;
  line-height: 28px;
  letter-spacing: 0.012em;
  font-weight: 700;
}

/* Day groups & swipeable transaction rows */
.day-group + .day-group {
  margin-top: 16px;
}

.day-header {
  position: sticky;
  top: calc(44px + env(safe-area-inset-top));
  z-index: 5;
  background: var(--page);
  padding: 6px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  font-weight: 600;
  color: var(--ink-muted);
}

.day-header-total {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.tx-list-group {
  background: var(--surface);
  border-radius: var(--r-card);
  border: 0.5px solid var(--card-edge);
  overflow: hidden;
}

.tx-swipe-wrap {
  position: relative;
  overflow: hidden;
}

.tx-swipe-wrap:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 64px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--hairline);
  pointer-events: none;
  z-index: 2;
}

.tx-swipe-action {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 88px;
  background: var(--outflow);
  color: var(--on-action);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  line-height: 13px;
  letter-spacing: 0;
  font-weight: 500;
}

/* Hidden until a row is dragged, so the red never bleeds through the rounded
   corners of a resting list group. */
.tx-swipe-action { visibility: hidden; }
.tx-swipe-wrap:has(.tx-row[style*="translateX"]) .tx-swipe-action { visibility: visible; }

/* Appearance lives in Settings on phones. */
@media (max-width: 1023px) {
  [data-action="cycle-theme"] { display: none; }
}

.tx-swipe-action svg {
  color: var(--on-action);
}

.tx-row {
  position: relative;
  z-index: 1;
  width: 100%;
  min-height: 60px;
  padding: 10px 16px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  transition: background-color var(--dur-release) ease, transform var(--dur-seg) var(--ease-spring);
}

.tx-row.is-pressed,
.tx-row:active {
  background: var(--surface-mid);
  transition-duration: 0ms;
}

.tx-row.is-new-flash {
  animation: newRowFlash 1200ms ease-out;
}

@keyframes newRowFlash {
  0% { background-color: var(--brand-soft); }
  100% { background-color: var(--surface); }
}

@media (hover: hover) and (pointer: fine) {
  .tx-row:hover {
    background: var(--surface-low);
  }
}

.tx-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.tx-text {
  min-width: 0;
  flex: 1;
}

.tx-title {
  font-size: 16px;
  line-height: 21px;
  letter-spacing: -0.014em;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tx-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tx-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  flex-shrink: 0;
}

.tx-amt {
  font-family: var(--font-num);
  font-size: 16px;
  line-height: 21px;
  letter-spacing: -0.014em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.tx-amt.is-expense { color: var(--ink); }
.tx-amt.is-income { color: var(--inflow); }
.tx-amt.is-transfer { color: var(--ink-muted); }

.ccy-label {
  font-size: 11px;
  line-height: 13px;
  font-weight: 500;
  letter-spacing: 0;
}

.ccy-label-usd { color: var(--usd); }
.ccy-label-khr { color: var(--khr); }

/* Search field with sliding Cancel button */
.search-row {
  display: flex;
  align-items: center;
  gap: 0;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 14px;
  color: var(--ink-muted);
  pointer-events: none;
  display: inline-flex;
}

.search-input {
  width: 100%;
  height: 44px;
  padding: 0 44px 0 38px;
  border-radius: var(--r-pill);
  border: 0;
  background: var(--fill);
  color: var(--ink);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  appearance: none;
  -webkit-appearance: none;
}

.search-input::-webkit-search-cancel-button {
  -webkit-appearance: none;
}

.search-input::placeholder {
  color: var(--ink-muted);
}

.search-clear-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-muted);
}

.search-cancel-btn {
  overflow: hidden;
  max-width: 0;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  padding: 0;
  margin-left: 0;
  min-height: 44px;
  font-size: 17px;
  letter-spacing: -0.025em;
  color: var(--brand);
  white-space: nowrap;
  transition: max-width var(--dur-seg) var(--ease-spring), opacity var(--dur-fade) ease, padding var(--dur-seg) var(--ease-spring), margin-left var(--dur-seg) var(--ease-spring), visibility 0s linear var(--dur-seg);
}

.search-row.is-focused .search-cancel-btn {
  max-width: 80px;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  padding: 0 4px;
  margin-left: 8px;
  transition: max-width var(--dur-seg) var(--ease-spring), opacity var(--dur-fade) ease, padding var(--dur-seg) var(--ease-spring), margin-left var(--dur-seg) var(--ease-spring), visibility 0s linear 0s;
}

/* Filter chips */
.filter-chip {
  position: relative;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--ink);
  font-size: 15px;
  line-height: 20px;
  letter-spacing: -0.014em;
  font-weight: 500;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  scale: 1;
  transition: background-color var(--dur-fade) ease, color var(--dur-fade) ease, scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.filter-chip::before {
  content: "";
  position: absolute;
  inset: -5px 0;
}

.filter-chip:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.filter-chip[aria-pressed="true"] {
  background: var(--brand);
  color: var(--on-action);
}

/* Activity 3-cell stat group */
.stat-group {
  background: var(--surface);
  border-radius: var(--r-card);
  border: 0.5px solid var(--card-edge);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  overflow: hidden;
}

.stat-cell {
  position: relative;
  padding: 12px 12px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.stat-cell + .stat-cell::before {
  content: "";
  position: absolute;
  left: 0;
  top: 12px;
  bottom: 12px;
  width: 0.5px;
  background: var(--hairline);
}

.stat-label {
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  color: var(--ink-muted);
}

.stat-val {
  font-family: var(--font-num);
  font-size: clamp(14px, 4.2vw, 17px);
  line-height: 22px;
  letter-spacing: -0.014em;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.empty-state {
  padding: 36px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: var(--ink-muted);
}

/* Buttons */
.btn-primary {
  width: 100%;
  height: 52px;
  padding: 0 20px;
  border-radius: var(--r-pill);
  background: var(--brand);
  color: var(--on-action);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring), opacity var(--dur-fade) ease, background-color var(--dur-fade) ease;
}

.btn-primary:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.btn-primary:disabled {
  background: var(--fill);
  color: var(--ink-faint);
}

.btn-secondary {
  height: 52px;
  padding: 0 20px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--brand);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring), opacity var(--dur-fade) ease;
}

.btn-secondary:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.btn-text-brand {
  min-height: 44px;
  padding: 0 12px;
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 400;
  color: var(--brand);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn-text-danger {
  width: 100%;
  height: 52px;
  padding: 0 20px;
  border-radius: var(--r-pill);
  background: var(--outflow-soft);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 600;
  color: var(--outflow);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.btn-text-danger:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

/* Accounts screen */
.acct-sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  margin-bottom: 8px;
}

.acct-sec-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 25px;
  letter-spacing: 0.012em;
  font-weight: 700;
  color: var(--ink);
}

.acct-card-row {
  position: relative;
  width: 100%;
  min-height: 60px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  background: var(--surface);
  transition: background-color var(--dur-release) ease;
}

.acct-card-row:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 64px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--hairline);
}

.acct-card-row:active {
  background: var(--surface-mid);
  transition-duration: 0ms;
}

@media (hover: hover) and (pointer: fine) {
  .acct-card-row:hover {
    background: var(--surface-low);
  }
}

.acct-right-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* Where it went and Insights */
.cat-bars {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cat-bar-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 15px;
  line-height: 20px;
  letter-spacing: -0.014em;
}

.cat-bar-track {
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--track);
  overflow: hidden;
}

.cat-bar-fill {
  height: 100%;
  border-radius: var(--r-pill);
  transition: width var(--dur-chart) var(--ease-spring);
}

/* Segmented control with sliding thumb */
.seg-switch {
  position: relative;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  height: 36px;
  padding: 2px;
  border-radius: var(--r-pill);
  background: var(--fill);
  align-items: stretch;
}

.seg-switch.is-full {
  display: grid;
  width: 100%;
}

.seg-thumb {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  border-radius: var(--r-pill);
  background: var(--surface);
  box-shadow: var(--shadow-thumb);
  transition: transform var(--dur-seg) var(--ease-spring);
  pointer-events: none;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .seg-thumb {
    background: var(--surface-mid);
  }
}
:root[data-theme="dark"] .seg-thumb {
  background: var(--surface-mid);
}

.seg-switch button {
  position: relative;
  z-index: 1;
  min-width: 56px;
  padding: 0 12px;
  font-size: 13px;
  line-height: 18px;
  letter-spacing: -0.006em;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
}

.seg-switch button::before {
  content: "";
  position: absolute;
  inset: -6px 0;
}

.seg-switch button[aria-pressed="true"] {
  font-weight: 600;
}

.donut-layout {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.donut-wrap {
  position: relative;
  width: 180px;
  height: 180px;
  flex-shrink: 0;
}

.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 26px;
  pointer-events: none;
}

.legend-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.legend-row {
  width: 100%;
  min-height: 44px;
  padding: 6px 10px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 15px;
  line-height: 20px;
  letter-spacing: -0.014em;
  text-align: left;
  transition: background-color var(--dur-release) ease, opacity var(--dur-fade) ease;
}

.legend-row.is-active {
  background: var(--surface-low);
}

.legend-row.is-dimmed {
  opacity: 0.45;
}

.legend-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.chart-host {
  width: 100%;
  touch-action: pan-y;
}

.insight-summary-row {
  position: relative;
  min-height: 60px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.insight-summary-row:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 64px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--hairline);
}

/* Settings grouped lists */
.settings-group {
  background: var(--surface);
  border-radius: var(--r-card);
  border: 0.5px solid var(--card-edge);
  overflow: hidden;
}

.settings-row {
  position: relative;
  min-height: 50px;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.settings-row:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 58px;
  right: 0;
  bottom: 0;
  height: 0.5px;
  background: var(--hairline);
}

.settings-row.no-icon:not(:last-child)::after {
  left: 16px;
}

.settings-row-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  flex: 1;
}

.settings-tile {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--on-action);
  flex-shrink: 0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .settings-tile {
    color: var(--page);
  }
}
:root[data-theme="dark"] .settings-tile {
  color: var(--page);
}

.settings-label {
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 400;
  color: var(--ink);
  white-space: nowrap;
}

@media (max-width: 479px) {
  .settings-row.settings-row-wrap {
    flex-wrap: wrap;
    padding-top: 10px;
    padding-bottom: 10px;
  }
  .settings-row.settings-row-wrap .settings-row-left {
    flex: 1 0 auto;
  }
  .settings-row.settings-row-wrap .seg-switch {
    flex: 1 1 100%;
    display: grid;
    width: 100%;
  }
}

.settings-value {
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  color: var(--ink-muted);
  text-align: right;
}

.rate-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.num-input {
  width: 96px;
  height: 44px;
  padding: 0 10px;
  border-radius: 12px;
  border: 0;
  background: var(--fill);
  color: var(--ink);
  font-family: var(--font-num);
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.toggle-btn {
  position: relative;
  width: 51px;
  height: 31px;
  padding: 2px;
  border-radius: var(--r-pill);
  background: var(--track);
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  transition: background-color 200ms ease;
}

.toggle-btn::before {
  content: "";
  position: absolute;
  inset: -7px 0;
}

.toggle-btn[aria-checked="true"] {
  background: var(--brand);
}

.toggle-thumb {
  width: 27px;
  height: 27px;
  border-radius: var(--r-pill);
  background: var(--on-hero);
  box-shadow: var(--shadow-thumb);
  transition: transform 200ms var(--ease-spring);
}

.toggle-btn[aria-checked="true"] .toggle-thumb {
  transform: translateX(20px);
}

/* Sheets */
.sheet-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--scrim);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur-sheet) var(--ease-spring);
}

.sheet-backdrop[hidden],
.action-backdrop[hidden] {
  display: none;
}

.sheet-backdrop.is-open {
  opacity: 1;
  pointer-events: auto;
}

.sheet-panel {
  position: relative;
  width: 100%;
  max-width: 520px;
  max-height: calc(100dvh - 24px - env(safe-area-inset-top));
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-radius: 34px 34px 0 0;
  padding: 0 var(--gutter) calc(12px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-float);
  transform: translateY(100%);
  transition: transform var(--dur-sheet) var(--ease-spring);
}

.sheet-backdrop.is-open .sheet-panel {
  transform: translateY(0);
}

.sheet-drag-zone {
  position: sticky;
  top: 0;
  z-index: 10;
  touch-action: none;
  margin: 0 calc(var(--gutter) * -1) 6px;
  padding: 6px var(--gutter) 6px;
  background: var(--glass);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border-bottom: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-highlight);
}

@supports not (backdrop-filter: blur(1px)) {
  .sheet-drag-zone {
    background: var(--material-thick);
  }
}

.sheet-handle {
  width: 36px;
  height: 5px;
  border-radius: 3px;
  background: var(--border);
  margin: 0 auto 6px;
}

.sheet-head {
  position: relative;
  min-height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-head-title {
  margin: 0;
  font-size: 17px;
  line-height: 22px;
  letter-spacing: -0.025em;
  font-weight: 600;
  color: var(--ink);
  text-align: center;
}

.sheet-close-btn {
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.sheet-close-circle {
  width: 30px;
  height: 30px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--ink-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.amount-stage {
  position: relative;
  margin: 6px 0 6px;
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.amount-display {
  font-family: var(--font-num);
  font-size: clamp(32px, 5.6dvh, 44px);
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: 0.011em;
  font-variant-numeric: tabular-nums;
  max-width: calc(100% - 130px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.amount-display.is-empty {
  color: var(--ink-faint);
}

.amount-converted {
  min-height: 16px;
  margin-top: 2px;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  color: var(--ink-muted);
  font-variant-numeric: tabular-nums;
}

.ccy-flip-btn {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  min-height: 34px;
  padding: 0 11px;
  border-radius: var(--r-pill);
  font-size: 13px;
  letter-spacing: -0.006em;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  scale: 1;
  transition: scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.ccy-flip-btn::before {
  content: "";
  position: absolute;
  inset: -5px 0;
}

.ccy-flip-btn:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.ccy-flip-btn.is-usd { background: var(--usd-soft); color: var(--usd); }
.ccy-flip-btn.is-khr { background: var(--khr-soft); color: var(--khr); }

.sheet-field-label {
  display: block;
  margin: 8px 0 4px;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: 0;
  font-weight: 500;
  color: var(--ink-muted);
}

.acct-chip-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  margin-inline: calc(var(--gutter) * -1);
  padding-inline: var(--gutter);
  padding-block: 2px;
  transition: opacity var(--dur-fade) ease;
}

.acct-chip-row::-webkit-scrollbar {
  display: none;
}

.acct-chip {
  height: 52px;
  padding: 6px 14px;
  border-radius: 18px;
  background: var(--fill);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 1px;
  flex-shrink: 0;
  scroll-snap-align: start;
  scale: 1;
  transition: background-color var(--dur-fade) ease, scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);
}

.acct-chip:active:not(:disabled) {
  scale: 0.96;
  filter: brightness(1.06);
  transition-duration: 0ms;
}

.acct-chip[aria-pressed="true"] {
  background: var(--brand-soft);
  box-shadow: inset 0 0 0 1.5px var(--brand);
}

.acct-chip:disabled {
  opacity: 0.4;
}

.cat-grid {
  display: flex;
  flex-wrap: nowrap;
  gap: 8px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scrollbar-width: none;
  margin-inline: calc(var(--gutter) * -1);
  padding-inline: var(--gutter);
  padding-block: 4px;
}

.cat-grid::-webkit-scrollbar {
  display: none;
}

.cat-chip {
  position: relative;
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  background: var(--fill);
  color: var(--ink);
  font-size: 15px;
  line-height: 20px;
  letter-spacing: -0.014em;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  scroll-snap-align: start;
  scale: 1;
  transition: background-color var(--dur-fade) ease, color var(--dur-fade) ease, scale 350ms var(--ease-spring), filter 350ms var(--ease-spring);

  }

  function formatMoneyRaw(m, opts) {
    var o = opts || {};
    var abs = Math.abs(m.minor);
    var sign = "";
    if (m.minor < 0) sign = "-";
    else if (m.minor > 0 && o.showPlus) sign = "+";

    if (m.currency === "USD") {
      var dollars = abs / 100;
      return sign + "$" + formatNumber(dollars, 2);
    }
    var hasFraction = abs % 100 !== 0;
    var riel = abs / 100;
    return sign + formatNumber(riel, hasFraction ? 2 : 0) + "៛";
  }

  // Selectors (all derived figures flow from here)
  function selectPockets() {
    var usdAccounts = state.accounts.filter(function (a) { return a.currency === "USD"; });
    var khrAccounts = state.accounts.filter(function (a) { return a.currency === "KHR"; });
    var usdSubtotal = money(usdAccounts.reduce(function (s, a) { return s + a.balance.minor; }, 0), "USD");
    var khrSubtotal = money(khrAccounts.reduce(function (s, a) { return s + a.balance.minor; }, 0), "KHR");

    var disp = state.displayCurrency;
    var usdInDisp = convert(usdSubtotal, disp, state.rate);
    var khrInDisp = convert(khrSubtotal, disp, state.rate);
    var totalDisp = money(usdInDisp.minor + khrInDisp.minor, disp);
    var other = otherCurrency(disp);
    var totalOther = money(convert(usdSubtotal, other, state.rate).minor + convert(khrSubtotal, other, state.rate).minor, other);

    var usdInUsd = usdSubtotal.minor;
    var khrInUsd = convert(khrSubtotal, "USD", state.rate).minor;
    var totalUsdMinor = Math.max(1, usdInUsd + khrInUsd);
    var usdSharePct = Math.round((usdInUsd / totalUsdMinor) * 100);
    var khrSharePct = 100 - usdSharePct;

    return {
      usdAccounts: usdAccounts,
      khrAccounts: khrAccounts,
      usdSubtotal: usdSubtotal,
      khrSubtotal: khrSubtotal,
      totalDisp: totalDisp,
      totalOther: totalOther,
      usdSharePct: usdSharePct,
      khrSharePct: khrSharePct
    };
  }

  // Ledger entries for Activity/Recent: collapses two transfer legs sharing groupId into one logical entry
  function selectLogicalTransactions() {
    var out = [];
    var seenGroups = {};
    for (var i = 0; i < state.transactions.length; i++) {
      var tx = state.transactions[i];
      if (tx.type === "transfer" && tx.groupId) {
        if (seenGroups[tx.groupId]) continue;
        seenGroups[tx.groupId] = true;
        var pair = state.transactions.filter(function (x) { return x.groupId === tx.groupId; });
        var fromLeg = pair.find(function (x) { return x.amount.minor < 0; }) || tx;
        var toLeg = pair.find(function (x) { return x.amount.minor > 0; }) || null;
        out.push({
          id: fromLeg.id,
          groupId: tx.groupId,
          date: fromLeg.date,
          title: fromLeg.title,
          categoryId: "transfer",
          accountId: fromLeg.accountId,
          peerAccountId: toLeg ? toLeg.accountId : fromLeg.peerAccountId,
          amount: money(Math.abs(fromLeg.amount.minor), fromLeg.amount.currency),
          fromAmount: fromLeg.amount,
          toAmount: toLeg ? toLeg.amount : null,
          type: "transfer",
          via: fromLeg.via
        });
      } else {
        out.push(tx);
      }
    }
    out.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    });
    return out;
  }

    var byKey = {};
    for (var i = 0; i < state.transactions.length; i++) {
      var tx = state.transactions[i];
      if (tx.type !== "expense") continue;
      if (tx.date.slice(0, 7) !== "2026-11") continue;
      var note = (tx.title || "").trim();
      if (!note) continue;
      var key = note.toLowerCase();
      if (!byKey[key]) {
        byKey[key] = {
          note: note,
          count: 0,
          latestDate: tx.date,
          latestId: tx.id,
          categoryId: tx.categoryId,
          accountId: tx.accountId,
          amount: money(Math.abs(tx.amount.minor), tx.amount.currency)
        };
      }
      var rec = byKey[key];
      rec.count += 1;
      if (tx.date > rec.latestDate || (tx.date === rec.latestDate && tx.id > rec.latestId)) {
        rec.latestDate = tx.date;
        rec.latestId = tx.id;
        rec.note = note;
        rec.categoryId = tx.categoryId;
        rec.accountId = tx.accountId;
        rec.amount = money(Math.abs(tx.amount.minor), tx.amount.currency);
      }
    }
    var list = Object.keys(byKey).map(function (k) { return byKey[k]; });
    list.sort(function (a, b) {
      if (b.count !== a.count) return b.count - a.count;
      if (a.latestDate !== b.latestDate) return a.latestDate < b.latestDate ? 1 : -1;
      return a.latestId < b.latestId ? 1 : -1;
    });
    return list.slice(0, 5);
  }

  function selectNovemberSummary() {
    var disp = state.displayCurrency;
    var spentList = [];
    var incomeList = [];
    var dailyExpenses = {};
    var dailyCurrencies = {};
    for (var d = 1; d <= MONTH_DAYS; d++) {
      dailyExpenses[d] = [];
      dailyCurrencies[d] = {};
    }

    for (var i = 0; i < state.transactions.length; i++) {
      var tx = state.transactions[i];
      if (tx.date.slice(0, 7) !== "2026-11") continue;
      if (tx.type === "transfer") continue;
      if (tx.type === "expense") {
        var pos = money(Math.abs(tx.amount.minor), tx.amount.currency);
        spentList.push(pos);
        var dayNum = parseInt(tx.date.slice(8, 10), 10);
        if (dailyExpenses[dayNum]) {
          dailyExpenses[dayNum].push(pos);
          dailyCurrencies[dayNum][tx.amount.currency] = true;
        }
      } else if (tx.type === "income") {
        incomeList.push(tx.amount);
      }
    }

    var spent = sumIn(spentList, disp, state.rate);
    var income = sumIn(incomeList, disp, state.rate);
    var net = money(income.minor - spent.minor, disp);

    var dailyTotals = [];
    var nonZeroUpToToday = [];
    for (var day = 1; day <= MONTH_DAYS; day++) {
      var tot = sumIn(dailyExpenses[day], disp, state.rate);
      dailyTotals.push({
        day: day,
        amount: tot,
        mixed: Object.keys(dailyCurrencies[day]).length > 1
      });
      if (day <= CURRENT_DAY && tot.minor > 0) {
        nonZeroUpToToday.push(tot.minor);
      }
    }

    nonZeroUpToToday.sort(function (a, b) { return a - b; });
    var typicalMinor = 0;
    if (nonZeroUpToToday.length > 0) {
      var mid = Math.floor(nonZeroUpToToday.length / 2);
      typicalMinor = nonZeroUpToToday.length % 2 === 1
        ? nonZeroUpToToday[mid]
        : Math.round((nonZeroUpToToday[mid - 1] + nonZeroUpToToday[mid]) / 2);
    }

    var avgMinor = Math.round(spent.minor / CURRENT_DAY);
    var avgPerDay = money(avgMinor, disp);
    var typicalDay = money(typicalMinor, disp);

    return {
      spent: spent,
      income: income,
      net: net,
      dailyTotals: dailyTotals,
      avgPerDay: avgPerDay,
      typicalDay: typicalDay
    };
  }

  function selectCategorySpending(ccy) {
    var targetCcy = ccy || state.displayCurrency;
    var byCat = {};
    for (var i = 0; i < state.transactions.length; i++) {
      var tx = state.transactions[i];
      if (tx.type !== "expense") continue;
      if (!byCat[tx.categoryId]) byCat[tx.categoryId] = [];
      byCat[tx.categoryId].push(money(Math.abs(tx.amount.minor), tx.amount.currency));
    }

    var rows = [];
    var totalMinor = 0;
    Object.keys(byCat).forEach(function (catId) {
      var cat = getCategory(catId);
      var amt = sumIn(byCat[catId], targetCcy, state.rate);
      totalMinor += amt.minor;
      rows.push({ category: cat, amount: amt });
    });

    rows.sort(function (a, b) { return b.amount.minor - a.amount.minor; });
    rows.forEach(function (r) {
      r.pct = totalMinor > 0 ? Math.round((r.amount.minor / totalMinor) * 100) : 0;
    });
    return { rows: rows, total: money(totalMinor, targetCcy) };
  }

  function selectBudgets() {
    var disp = state.displayCurrency;
    var catSpendUsd = {};
    var catSpendDisp = {};
    var spUsd = selectCategorySpending("USD").rows;
    spUsd.forEach(function (r) { catSpendUsd[r.category.id] = r.amount; });
    var spDisp = selectCategorySpending(disp).rows;
    spDisp.forEach(function (r) { catSpendDisp[r.category.id] = r.amount; });

    var elapsedShare = CURRENT_DAY / MONTH_DAYS;
    var daysLeft = MONTH_DAYS - CURRENT_DAY;
    var budgetedIds = {};
    var totalLimitUsd = 0;
    var totalSpentUsd = 0;

    var items = BUDGETS.map(function (b) {
      budgetedIds[b.categoryId] = true;
      var cat = getCategory(b.categoryId);
      var spentUsd = catSpendUsd[b.categoryId] || money(0, "USD");
      var limitDisp = convert(b.limitUsd, disp, state.rate);
      var spentDisp = catSpendDisp[b.categoryId] || money(0, disp);
      totalLimitUsd += b.limitUsd.minor;
      totalSpentUsd += spentUsd.minor;

      var ratio = b.limitUsd.minor > 0 ? spentUsd.minor / b.limitUsd.minor : 0;
      var pct = Math.round(ratio * 100);
      var status = "ok";
      var caption = "";

      if (ratio > 1) {
        status = "over";
        var overAmt = money(spentDisp.minor - limitDisp.minor, disp);
        caption = "Over by " + formatMoney(overAmt);
      } else if (ratio > elapsedShare + 0.1) {
        status = "warn";
        var leftAmt = money(limitDisp.minor - spentDisp.minor, disp);
        caption = "Ahead of pace, " + formatMoney(leftAmt) + " left for " + daysLeft + " days";
      } else if (ratio < elapsedShare - 0.1) {
        var underAmt = money(limitDisp.minor - spentDisp.minor, disp);
        caption = "Under pace, " + formatMoney(underAmt) + " left for " + daysLeft + " days";
      } else {
        var remAmt = money(limitDisp.minor - spentDisp.minor, disp);
        caption = "On pace, " + formatMoney(remAmt) + " left for " + daysLeft + " days";
      }

      return {
        category: cat,
        limitDisp: limitDisp,
        spentDisp: spentDisp,
        remainingDisp: money(limitDisp.minor - spentDisp.minor, disp),
        ratio: ratio,
        pct: pct,
        status: status,
        caption: caption
      };
    });

    items.sort(function (a, b) { return b.ratio - a.ratio; });

    var unbudgeted = selectCategorySpending(disp).rows.filter(function (r) {
      return !budgetedIds[r.category.id];
    });

    var totalLimitDisp = convert(money(totalLimitUsd, "USD"), disp, state.rate);
    var totalSpentDisp = convert(money(totalSpentUsd, "USD"), disp, state.rate);
    var totalRatio = totalLimitUsd > 0 ? totalSpentUsd / totalLimitUsd : 0;
    var totalPct = Math.round(totalRatio * 100);
    var remainingAllDisp = money(Math.max(0, totalLimitDisp.minor - totalSpentDisp.minor), disp);
    var perDayLeft = money(Math.round(remainingAllDisp.minor / Math.max(1, daysLeft)), disp);

    var verdict = "You are on pace. About " + formatMoney(perDayLeft) + " a day keeps you inside it.";
    if (totalRatio > 1) {
      verdict = "You are over your total budget for the month.";
    } else if (totalRatio > elapsedShare + 0.05) {
      verdict = "You are a little ahead of pace. About " + formatMoney(perDayLeft) + " a day keeps you inside it.";
    } else if (totalRatio < elapsedShare - 0.05) {
      verdict = "You are under pace. About " + formatMoney(perDayLeft) + " a day keeps you inside it.";
    }

    return {
      items: items,
      unbudgeted: unbudgeted,
      totalLimitDisp: totalLimitDisp,
      totalSpentDisp: totalSpentDisp,
      totalPct: totalPct,
      totalRatio: totalRatio,
      elapsedShare: elapsedShare,
      verdict: verdict
    };
  }

  function formatDayLabel(iso) {
    if (iso === TODAY) return "Today";
    if (iso === "2026-11-14") return "Yesterday";
    var day = parseInt(iso.slice(8, 10), 10);
    var m = iso.slice(5, 7);
    var monthName = m === "11" ? "Nov" : m === "10" ? "Oct" : m;
    return day + " " + monthName;
  }

  function formatShortDate(iso) {
    var day = parseInt(iso.slice(8, 10), 10);
    var months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var mIdx = Math.max(0, Math.min(11, parseInt(iso.slice(5, 7), 10) - 1));
    return day + " " + months[mIdx] + " " + iso.slice(0, 4);
  }

    var pendingFrom = opts.key && state.pendingSegSlides ? state.pendingSegSlides[opts.key] : undefined;
    var startIdx = (typeof pendingFrom === "number" && pendingFrom !== activeIdx && !prefersReducedMotion()) ? pendingFrom : activeIdx;
    var slideAttr = startIdx !== activeIdx ? ' data-slide-to="' + activeIdx + '"' : "";
    var thumbStyle = "width:calc((100% - 4px) / " + count + ");transform:translateX(" + (startIdx * 100) + "%);";
    var extraClass = opts.full ? " is-full" : "";
    return '<div class="seg-switch' + extraClass + '" role="group" aria-label="' + escapeHtml(opts.label) + '" style="grid-template-columns:repeat(' + count + ',1fr);">' +
      '<span class="seg-thumb"' + slideAttr + ' style="' + thumbStyle + '" aria-hidden="true"></span>' +
      opts.items.map(function (it) {

    var disp = state.displayCurrency;
    var isCurrentMonth = state.monthCursor === 1;
    var oct = HISTORICAL_MONTHS[4];

      var octSpent = convert(money(oct.spendingUsd, "USD"), disp, state.rate);
      var octIncome = convert(money(oct.incomeUsd, "USD"), disp, state.rate);
      var octNet = money(octIncome.minor - octSpent.minor, disp);
      var octNetClass = octNet.minor >= 0 ? "val-inflow" : "val-outflow";

            '<div><span class="month-fig-label">Left over</span><span class="month-fig-val ' + octNetClass + '">' + formatMoney(octNet, { showPlus: octNet.minor > 0 }) + "</span></div>" +
          "</div>" +

    }

    var nov = selectNovemberSummary();
    var netClass = nov.net.minor >= 0 ? "val-inflow" : "val-outflow";
    var maxDaily = 1;
    nov.dailyTotals.forEach(function (d) {
      if (d.day <= CURRENT_DAY && d.amount.minor > maxDaily) maxDaily = d.amount.minor;
    });
    var secondDaily = 1;
    nov.dailyTotals.forEach(function (d) {
      if (d.day <= CURRENT_DAY && d.amount.minor < maxDaily && d.amount.minor > secondDaily) secondDaily = d.amount.minor;
    });
    var capped = maxDaily > secondDaily * 2;
    var chartMax = Math.max(capped ? secondDaily * 1.2 : maxDaily, 1);
    var typicalBottomPct = Math.min(92, Math.max(6, Math.round((nov.typicalDay.minor / chartMax) * 100)));

    var barsHtml = nov.dailyTotals.map(function (d) {
      var isFuture = d.day > CURRENT_DAY;
      var isToday = d.day === CURRENT_DAY;
      var isSelected = !isFuture && d.day === state.selectedDay;
      var isCapped = !isFuture && d.amount.minor > chartMax;
      var pct = isFuture ? 4 : Math.min(100, Math.max(5, Math.round((d.amount.minor / chartMax) * 100)));
      var cls = "daily-bar-btn" +
        (isToday ? " is-today" : "") +
        (isSelected ? " is-selected" : "") +
        (isFuture ? " is-future" : "") +
        (!isFuture && d.amount.minor === 0 ? " is-zero" : "") +
        (isCapped ? " is-capped" : "");
      var label = d.day + " Nov, " + (isFuture ? "upcoming" : formatMoney(d.amount));
      return '<button type="button" class="' + cls + '" data-action="select-day" data-day="' + d.day + '" aria-label="' + escapeHtml(label) + '"' + (isFuture ? " disabled" : "") + ">" +
        (isToday ? '<span class="daily-today-dot" aria-hidden="true"></span>' : "") +
        '<span class="daily-bar-fill" style="height:' + pct + '%"></span>' +
      "</button>";
    }).join("");

    var activeDay = nov.dailyTotals[Math.max(0, Math.min(CURRENT_DAY - 1, state.selectedDay - 1))];
    var calloutDay = activeDay ? (activeDay.day + " Nov") : "";
    var calloutAmt = activeDay ? formatMoney(activeDay.amount) : "";
    var typicalLabelHtml = state.hideAmounts
      ? ""
      : '<span class="daily-typical-label">typical ' + formatMoney(nov.typicalDay) + "</span>";

    return '<section class="sec-wrap" aria-label="November summary">' +
      '<div class="month-sec-head">' +
        '<div class="month-head-left">' +
          '<button type="button" class="stepper-btn" data-action="month-prev" aria-label="Previous month">' + svgIcon(ICONS.chevronLeft, 18) + "</button>" +
          '<h2 class="sec-title">November</h2>' +
          '<button type="button" class="stepper-btn" data-action="month-next" disabled aria-label="Next month">' + svgIcon(ICONS.chevronRight, 18) + "</button>" +
        "</div>" +
        '<span class="caption">Day ' + CURRENT_DAY + " of " + MONTH_DAYS + "</span>" +
      "</div>" +
      '<div class="card">' +
        '<div class="month-figures">' +
          '<div><span class="month-fig-label">Spent</span><span class="month-fig-val">' + formatMoney(nov.spent) + "</span></div>" +
          '<div><span class="month-fig-label">Came in</span><span class="month-fig-val val-inflow">' + formatMoney(nov.income) + "</span></div>" +
          '<div><span class="month-fig-label">Left over</span><span class="month-fig-val ' + netClass + '">' + formatMoney(nov.net, { showPlus: nov.net.minor > 0 }) + "</span></div>" +
        "</div>" +
        '<div class="caption month-note">Converted to ' + disp + ". Transfers left out.</div>" +
        '<div class="chart-callout">' +
          '<div class="chart-callout-label" id="dailyCalloutLabel">' + escapeHtml(calloutDay) + "</div>" +
          '<div class="chart-callout-val" id="dailyCalloutVal">' + escapeHtml(calloutAmt) + "</div>" +
        "</div>" +
        '<div class="daily-chart-wrap" role="img" aria-label="Daily spending in November up to day 15, typical day ' + escapeHtml(formatMoney(nov.typicalDay)) + '">' +
          '<div class="daily-bars" id="dailyBars">' +
            barsHtml +
            '<div class="daily-typical-line" style="bottom:' + typicalBottomPct + '%">' +
              typicalLabelHtml +
            "</div>" +
          "</div>" +
        "</div>" +
      "</div>" +
    "</section>";
  }

  function renderActivityScreen() {
    var all = selectLogicalTransactions();
    var q = state.activitySearch.trim().toLowerCase();
    var filtered = all.filter(function (tx) {
      if (state.activityAccountId) {
        if (tx.accountId !== state.activityAccountId && tx.peerAccountId !== state.activityAccountId) return false;
      }
      if (state.activityType !== "all" && tx.type !== state.activityType) return false;
      if (state.activityCcyUsd || state.activityCcyKhr) {
        var matchUsd = state.activityCcyUsd && tx.amount.currency === "USD";
        var matchKhr = state.activityCcyKhr && tx.amount.currency === "KHR";
        if (!matchUsd && !matchKhr) return false;
      }
      if (q) {
        var cat = tx.type === "transfer" ? { name: "Transfer" } : getCategory(tx.categoryId);
        var acct = getAccount(tx.accountId);
        var peer = tx.peerAccountId ? getAccount(tx.peerAccountId) : null;
        var hay = (tx.title + " " + cat.name + " " + (acct ? acct.name : "") + " " + (peer ? peer.name : "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    var disp = state.displayCurrency;
    var spentList = [];
    var inList = [];
    filtered.forEach(function (tx) {
      if (tx.type === "expense") spentList.push(money(Math.abs(tx.amount.minor), tx.amount.currency));
      if (tx.type === "income") inList.push(tx.amount);
    });
    var totalSpent = sumIn(spentList, disp, state.rate);
    var totalIn = sumIn(inList, disp, state.rate);

    var groups = [];
    var byDate = {};
    filtered.forEach(function (tx) {
      if (!byDate[tx.date]) {
        byDate[tx.date] = [];
        groups.push(tx.date);
      }
      byDate[tx.date].push(tx);
    });

    var acctFilter = state.activityAccountId ? getAccount(state.activityAccountId) : null;
    var acctChipHtml = acctFilter
      ? '<button type="button" class="filter-chip" data-action="clear-activity-account" aria-pressed="true">' +
          "<span>" + escapeHtml(acctFilter.name) + "</span>" +
          svgIcon(ICONS.close, 14) +
        "</button>"
      : "";

    var searchRowClass = "search-row" + (state.activitySearchFocused || state.activitySearch ? " is-focused" : "");
    var clearBtn = state.activitySearch
      ? '<button type="button" class="search-clear-btn" data-action="clear-activity-search" aria-label="Clear search">' + svgIcon(ICONS.close, 15) + "</button>"
      : "";

    var listHtml = filtered.length === 0
      ? '<div class="card"><div class="empty-state">' +
          svgIcon(ICONS.search, 28) +
          "<div>Nothing matches that.</div>" +
          '<button type="button" class="btn-secondary" data-action="clear-activity-filters">Clear filters</button>' +
        "</div></div>"

    return renderScreenHead("Activity") +
      '<div class="stack-16">' +
        '<div class="' + searchRowClass + '" id="searchRow">' +
          '<div class="search-wrap">' +
            '<span class="search-icon">' + svgIcon(ICONS.search, 16) + "</span>" +
            '<input type="search" class="search-input" id="activitySearch" value="' + escapeHtml(state.activitySearch) + '" placeholder="Search notes and categories" aria-label="Search notes and categories">' +
            clearBtn +
          "</div>" +
          '<button type="button" class="search-cancel-btn" data-action="cancel-activity-search">Cancel</button>' +
        "</div>" +
        '<div class="chip-scroll" role="group" aria-label="Filter transactions">' +
          acctChipHtml +
          '<button type="button" class="filter-chip" data-action="activity-type" data-type="all" aria-pressed="' + (state.activityType === "all") + '">All</button>' +
          '<button type="button" class="filter-chip" data-action="activity-type" data-type="expense" aria-pressed="' + (state.activityType === "expense") + '">Spending</button>' +
          '<button type="button" class="filter-chip" data-action="activity-type" data-type="income" aria-pressed="' + (state.activityType === "income") + '">Income</button>' +
          '<button type="button" class="filter-chip" data-action="activity-type" data-type="transfer" aria-pressed="' + (state.activityType === "transfer") + '">Transfers</button>' +
          '<button type="button" class="filter-chip" data-action="activity-ccy" data-ccy="USD" aria-pressed="' + state.activityCcyUsd + '">Dollars</button>' +
          '<button type="button" class="filter-chip" data-action="activity-ccy" data-ccy="KHR" aria-pressed="' + state.activityCcyKhr + '">Riel</button>' +
        "</div>" +
        '<div class="stat-group" aria-label="Filtered totals">' +
          '<div class="stat-cell"><span class="stat-label">Entries</span><span class="stat-val">' + filtered.length + "</span></div>" +
          '<div class="stat-cell"><span class="stat-label">Spent</span><span class="stat-val">' + formatMoney(totalSpent) + "</span></div>" +
          '<div class="stat-cell"><span class="stat-label">Came in</span><span class="stat-val val-inflow">' + formatMoney(totalIn) + "</span></div>" +
        "</div>" +
        '<div class="caption" style="padding:0 4px;margin-top:-8px;">Totals converted to ' + disp + ". Transfers left out.</div>" +

    var novIncUsd = convert(nov.income, "USD", state.rate).minor;
    var novSpendUsd = convert(nov.spent, "USD", state.rate).minor;

      key: "2026-11",
