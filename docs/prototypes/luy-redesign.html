  function renderInsightsCharts() {
    var sixHost = document.getElementById("sixMonthChartHost");
    var nwHost = document.getElementById("netWorthChartHost");
    if (!sixHost || !nwHost) return;

    var months = getInsightsSixMonthData();
    var w = Math.max(260, Math.round(sixHost.clientWidth || 320));
    var h = 176;
    var padL = 10;
    var padR = 10;
    var padT = 10;
    var padB = 26;
    var plotH = h - padT - padB;
    var groupW = (w - padL - padR) / months.length;
    var barW = Math.min(18, Math.max(10, Math.floor((groupW - 14) / 2)));

    var maxBar = 1;
    months.forEach(function (m) {
      if (m.income.minor > maxBar) maxBar = m.income.minor;
      if (m.spending.minor > maxBar) maxBar = m.spending.minor;
    });

    function topRoundedBarPath(x, y, bw, bh) {
      var r = Math.min(6, bw / 2, bh);
      return "M" + x.toFixed(1) + "," + (y + bh).toFixed(1) +
        " V" + (y + r).toFixed(1) +
        " Q" + x.toFixed(1) + "," + y.toFixed(1) + " " + (x + r).toFixed(1) + "," + y.toFixed(1) +
        " H" + (x + bw - r).toFixed(1) +
        " Q" + (x + bw).toFixed(1) + "," + y.toFixed(1) + " " + (x + bw).toFixed(1) + "," + (y + r).toFixed(1) +
        " V" + (y + bh).toFixed(1) + " Z";
    }

    var selSix = Math.max(0, Math.min(months.length - 1, state.selectedSixMonthIdx));
    var barsSvg = months.map(function (m, idx) {
      var gx = padL + idx * groupW + groupW / 2;
      var ih = Math.max(4, (m.income.minor / maxBar) * plotH);
      var sh = Math.max(4, (m.spending.minor / maxBar) * plotH);
      var iy = padT + plotH - ih;
      var sy = padT + plotH - sh;
      var op = idx === selSix ? "1" : "0.45";
      return '<g tabindex="0" class="month-bar-group" data-month-idx="' + idx + '" opacity="' + op + '" style="cursor:pointer;">' +
        '<rect x="' + (padL + idx * groupW).toFixed(1) + '" y="0" width="' + groupW.toFixed(1) + '" height="' + h + '" fill="transparent"/>' +
        '<path d="' + topRoundedBarPath(gx - barW - 2, iy, barW, ih) + '" fill="var(--inflow)"/>' +
        '<path d="' + topRoundedBarPath(gx + 2, sy, barW, sh) + '" fill="var(--brand)"/>' +
        '<text x="' + gx.toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle" font-size="11" font-weight="' + (idx === selSix ? "600" : "400") + '" fill="' + (idx === selSix ? "var(--ink)" : "var(--ink-faint)") + '">' + m.label + "</text>" +
      "</g>";
    }).join("");

    sixHost.innerHTML = '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '" style="display:block;width:100%;height:' + h + 'px;" role="img" aria-label="Grouped bars of monthly income and spending from June to November">' +
      barsSvg +
    "</svg>";

    var c6 = formatSixMonthCallout(months[selSix]);
    var lbl6 = document.getElementById("sixMonthCalloutLabel");
    var val6 = document.getElementById("sixMonthCalloutVal");
    if (lbl6) lbl6.textContent = c6.label;
    if (val6) val6.textContent = c6.val;

    // Net worth chart
    var nwW = Math.max(260, Math.round(nwHost.clientWidth || w));
    var nwGroupW = (nwW - padL - padR) / months.length;
    var minNw = months[0].netWorth.minor;
    var maxNw = months[0].netWorth.minor;
    months.forEach(function (m) {
      if (m.netWorth.minor < minNw) minNw = m.netWorth.minor;
      if (m.netWorth.minor > maxNw) maxNw = m.netWorth.minor;
    });
    var nwRange = Math.max(1, maxNw - minNw);
    var nwPts = months.map(function (m, idx) {
      var x = padL + idx * nwGroupW + nwGroupW / 2;
      var norm = (m.netWorth.minor - minNw) / nwRange;
      var y = padT + 10 + (1 - norm) * (plotH - 18);
      return { x: x, y: y, label: m.label, fullLabel: m.fullLabel, val: m.netWorth };
    });

    var linePath = nwPts.map(function (pt, idx) {

  // Shell navigation and topbar
  function parseHashRoute() {
    var raw = (window.location.hash || "#/").replace(/^#/, "");
    if (!raw || raw[0] !== "/") raw = "/";
    return ROUTES[raw] ? raw : "/";
  }

  function isPhoneViewport() {
    return !(window.matchMedia && window.matchMedia("(min-width: 1024px)").matches);
  }

  function setDockCollapsed(collapsed) {
    var next = !!collapsed && isPhoneViewport() && !prefersReducedMotion() && !state.sheet && !state.actionConfirm && !state.scrollLocked;
    state.dockCollapsed = next;
    var dock = document.getElementById("floatingDock");
    if (dock) dock.classList.toggle("is-collapsed", next);
  }

  function triggerThumbStretch(el) {
    if (!el || prefersReducedMotion()) return;
    el.classList.remove("is-stretching");
    void el.offsetWidth;
    el.classList.add("is-stretching");
    clearTimeout(el._stretchTimer);
    el._stretchTimer = setTimeout(function () {
      el.classList.remove("is-stretching");
    }, 300);
  }

  function animateSegThumbs(container) {
    if (!container) return;
    var thumbs = container.querySelectorAll("[data-slide-to]");
    if (thumbs.length > 0 && !prefersReducedMotion()) {
      for (var i = 0; i < thumbs.length; i++) {
        (function (thumb) {
          var toIdx = parseInt(thumb.getAttribute("data-slide-to"), 10);
          thumb.removeAttribute("data-slide-to");
          if (isNaN(toIdx)) return;
          void thumb.offsetWidth;
          thumb.style.transform = "translateX(" + (toIdx * 100) + "%)";
          triggerThumbStretch(thumb);
        })(thumbs[i]);
      }
    }
    state.pendingSegSlides = {};
  }

  function updateTopbarScrollState() {
    if (state.scrollLocked) return;
    var y = Math.max(0, window.scrollY || window.pageYOffset || 0);
    var scrollEdge = document.getElementById("scrollEdge");
    if (scrollEdge) {
      scrollEdge.style.opacity = Math.min(1, Math.max(0, y / 24)).toFixed(3);
    }

    var topbar = document.getElementById("topbar");
    var titleEl = document.getElementById("screenTitle");
    if (!topbar) return;
    if (!titleEl) {
      topbar.classList.toggle("is-scrolled", y > 24);
      return;
    }
    var barBottom = topbar.getBoundingClientRect().bottom;
    var titleBottom = titleEl.getBoundingClientRect().bottom;
    topbar.classList.toggle("is-scrolled", titleBottom <= barBottom + 4);
  }

  function updateDockCollapseOnScroll() {
    if (state.scrollLocked || state.sheet || state.actionConfirm) {
      if (state.dockCollapsed) setDockCollapsed(false);
      return;
    }
    if (!isPhoneViewport() || prefersReducedMotion()) {
      if (state.dockCollapsed) setDockCollapsed(false);
      return;
    }

    var y = Math.max(0, window.scrollY || window.pageYOffset || 0);
    var maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);

    if (y <= 2) {
      setDockCollapsed(false);
      state.scrollAnchorY = y;
      state.scrollDir = 0;
      state.lastScrollY = y;
      return;
    }

    if (maxScroll > 36 && y >= maxScroll - 8) {
      setDockCollapsed(false);
      state.scrollAnchorY = y;
      state.scrollDir = 0;
      state.lastScrollY = y;
      return;
    }

    var delta = y - state.lastScrollY;
    if (delta > 0) {
      if (state.scrollDir !== 1) {
        state.scrollDir = 1;
        state.scrollAnchorY = state.lastScrollY;
      }
      if (y - state.scrollAnchorY > 24) {
        setDockCollapsed(true);
      }
    } else if (delta < 0) {
      if (state.scrollDir !== -1) {
        state.scrollDir = -1;
        state.scrollAnchorY = state.lastScrollY;
      }
      if (state.scrollAnchorY - y >= 12) {
        setDockCollapsed(false);
      }
    }
    state.lastScrollY = y;
  }

  function onWindowScroll() {
    updateTopbarScrollState();
    updateDockCollapseOnScroll();
  }

  function navigate(route, opts) {
    var o = opts || {};
    if (!ROUTES[route]) route = "/";
    var prevRoute = state.route;
    var prevMeta = ROUTES[prevRoute] || ROUTES["/"];
    var nextMeta = ROUTES[route];

    if (!prevMeta.isSub && nextMeta.isSub) {
      state.prevMainRoute = prevRoute;
      state.navAnim = "push";
    } else if (prevMeta.isSub && !nextMeta.isSub) {
      state.navAnim = "pop";
    } else {
      state.navAnim = "fade";
    }

    var main = document.getElementById("mainContent");
    var existingGhost = document.getElementById("pushGhost");
    if (existingGhost) existingGhost.remove();

    if ((state.navAnim === "push" || state.navAnim === "pop") && !prefersReducedMotion() && main) {
      var ghost = document.createElement("div");
      ghost.id = "pushGhost";
      ghost.className = "push-ghost" + (state.navAnim === "pop" ? " is-pop-out" : "");
      ghost.setAttribute("aria-hidden", "true");
      ghost.innerHTML = main.innerHTML;
      var ghostIds = ghost.querySelectorAll("[id]");
      for (var gi = 0; gi < ghostIds.length; gi++) ghostIds[gi].removeAttribute("id");
      document.body.appendChild(ghost);
      setTimeout(function () {
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      }, 420);
    }

    state.route = route;
    if (window.location.hash !== "#" + route) {
      window.location.hash = "#" + route;
    }
    state.lastScrollY = 0;
    state.scrollAnchorY = 0;
    state.scrollDir = 0;
    setDockCollapsed(false);
    window.scrollTo(0, 0);
    render();
    if (o.scrollToId) {
      var target = document.getElementById(o.scrollToId);
      if (target) target.scrollIntoView({ behavior: prefersReducedMotion() ? "auto" : "smooth", block: "start" });
    }
  }

        "<span>" + it.label + "</span>" +
      "</button>";
    }).join("");

    var tabIdx = meta.tabIdx;
    var dock = document.getElementById("floatingDock");
    if (!dock.querySelector(".tab-capsule")) {
      var indicatorStyle = tabIdx >= 0
        ? "transform:translateX(" + (tabIdx * 100) + "%);opacity:1;"
        : "transform:translateX(0);opacity:0;";
      dock.innerHTML =
        '<nav class="tab-capsule" aria-label="Primary tabs">' +
          '<span class="tab-indicator" style="' + indicatorStyle + '" aria-hidden="true"></span>' +
          bnavBtn("/", "Home", ICONS.home) +
          bnavBtn("/activity", "Activity", ICONS.activity) +
          bnavBtn("/budgets", "Budgets", ICONS.budgets) +
          bnavBtn("/insights", "Insights", ICONS.insights) +
        "</nav>" +
        '<button type="button" class="dock-add-btn" data-action="open-add" aria-label="Add transaction">' +
          svgIcon(ICONS.plus, 24, 2.2) +
        "</button>";
    } else {
      var tabBtns = dock.querySelectorAll(".bnav-item");
      for (var bi = 0; bi < tabBtns.length; bi++) {
        var r = tabBtns[bi].getAttribute("data-route");
        if (state.route === r) tabBtns[bi].setAttribute("aria-current", "page");
        else tabBtns[bi].removeAttribute("aria-current");
      }
      var ind = dock.querySelector(".tab-indicator");
      if (ind) {
        if (tabIdx >= 0) {
          ind.style.transform = "translateX(" + (tabIdx * 100) + "%)";
          ind.style.opacity = "1";
          if (state.lastTabIdx >= 0 && state.lastTabIdx !== tabIdx) {
            triggerThumbStretch(ind);
          }
        } else {
          ind.style.opacity = "0";
        }
      }
    }
    state.lastTabIdx = tabIdx;
    dock.classList.toggle("is-collapsed", !!state.dockCollapsed);

    updateTopbarScrollState();
  }

  function bnavBtn(route, label, iconPath) {
    var cur = state.route === route ? ' aria-current="page"' : "";
    return '<button type="button" class="bnav-item" data-action="nav" data-route="' + route + '"' + cur + ">" +
      svgIcon(iconPath, 20) +
      "<span>" + label + "</span>" +
    "</button>";
  }

  // Add sheet & modal helpers
  function defaultAccountForCurrency(ccy) {
    var match = state.accounts.find(function (a) { return a.currency === ccy; });
    return match ? match.id : state.accounts[0].id;
  }

  function largestAccountForCurrency(ccy) {
    var list = state.accounts.filter(function (a) { return a.currency === ccy; });
    if (list.length === 0) return state.accounts[0];
    var best = list[0];
    for (var i = 1; i < list.length; i++) {
      if (list[i].balance.minor > best.balance.minor) best = list[i];
    }
    return best;
  }

  function transferDefaultPair() {
    var fromAcct = largestAccountForCurrency(state.displayCurrency);
    var otherCcy = otherCurrency(fromAcct.currency);
    var toAcct = state.accounts.find(function (a) { return a.currency === otherCcy && a.id !== fromAcct.id; }) ||
      state.accounts.find(function (a) { return a.id !== fromAcct.id; }) ||
      state.accounts[0];
    return { fromId: fromAcct.id, toId: toAcct.id };
  }

  function parseInputToMoney(str, ccy) {
    if (!str) return money(0, ccy);
    if (ccy === "KHR") {
      var whole = parseInt(str, 10) || 0;
      return money(whole * 100, "KHR");
    }
    var parts = str.split(".");
    var dollars = parseInt(parts[0] || "0", 10) || 0;
    var centsStr = (parts[1] || "").padEnd(2, "0").slice(0, 2);
    var cents = parseInt(centsStr, 10) || 0;
    return money(dollars * 100 + cents, "USD");
  }

  function formatRawAmountStage(str, ccy) {
    if (!str) return ccy === "USD" ? "$0" : "0៛";
    if (ccy === "KHR") {
      var val = parseInt(str, 10) || 0;
      return formatNumber(val, 0) + "៛";
    }
    var parts = str.split(".");
    var intPart = parseInt(parts[0] || "0", 10) || 0;
    var prefix = "$" + formatNumber(intPart, 0);
    if (parts.length > 1) return prefix + "." + parts[1];
    return prefix;
  }

  function moneyToRawString(amt) {
    if (!amt || amt.minor === 0) return "";
    var abs = Math.abs(amt.minor);
    if (amt.currency === "KHR") {
      return String(Math.round(abs / 100));
    }
    var val = (abs / 100).toFixed(2);
    if (val.slice(-3) === ".00") return val.slice(0, -3);
    return val;
  }

  function lockBodyScroll() {
    if (state.scrollLocked) return;
    setDockCollapsed(false);
    state.lockedScrollY = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = -state.lockedScrollY + "px";
    document.body.classList.add("sheet-scroll-lock");
    var shell = document.getElementById("appShell");
    if (shell) shell.classList.add("is-sheet-behind");
    state.scrollLocked = true;
  }

  function unlockBodyScroll() {
    if (!state.scrollLocked) return;
    if (state.sheet || state.actionConfirm) return;
    document.body.classList.remove("sheet-scroll-lock");
    document.body.style.top = "";
    var shell = document.getElementById("appShell");
    if (shell) {
      shell.classList.remove("is-sheet-behind");
      shell.style.transform = "";
      shell.style.borderRadius = "";
    }
    state.scrollLocked = false;
    state.lastScrollY = state.lockedScrollY;
    state.scrollAnchorY = state.lockedScrollY;
    state.scrollDir = 0;
    window.scrollTo(0, state.lockedScrollY);
  }

  function openAddSheet(opener) {
    state.lastOpener = opener || document.activeElement;
    state.datePopoverOpen = false;
    var initCcy = state.displayCurrency;
    var acctId = defaultAccountForCurrency(initCcy);
    var xferPair = transferDefaultPair();
    state.sheet = {
      kind: "add",
      txType: "expense",
      currency: initCcy,
      rawAmount: "",
      accountId: acctId,
      fromAccountId: xferPair.fromId,
      toAccountId: xferPair.toId,
      categoryId: "food",
      note: "",
      date: TODAY,
      currencyHintVisible: false,
      fadeAccounts: false
    };
    renderSheet();
  }

  function openAddPrefilled(preset, opener) {
    state.lastOpener = opener || document.activeElement;
    state.datePopoverOpen = false;
    var txType = preset.txType === "income" ? "income" : "expense";
    var amt = preset.amount || money(0, state.displayCurrency);
    var acct = getAccount(preset.accountId);
    var ccy = acct ? acct.currency : amt.currency;
    var acctId = acct ? acct.id : defaultAccountForCurrency(ccy);
    var xferPair = transferDefaultPair();
    state.sheet = {
      kind: "add",
      txType: txType,
      currency: ccy,
      rawAmount: moneyToRawString(amt),
      accountId: acctId,
      fromAccountId: xferPair.fromId,
      toAccountId: xferPair.toId,
      categoryId: preset.categoryId || (txType === "income" ? "salary" : "food"),
      note: preset.note || "",
      date: TODAY,
      currencyHintVisible: false,
      fadeAccounts: false
    };
    renderSheet();
  }

  function openDetailSheet(txId, opener) {
    state.lastOpener = opener || document.activeElement;
    state.datePopoverOpen = false;
    state.sheet = {
      kind: "detail",
      txId: txId
    };
    renderSheet();
  }

  function closeSheet() {
    var backdrop = document.getElementById("sheetBackdrop");
    var panel = document.getElementById("sheetPanel");
    state.datePopoverOpen = false;
    state.sheet = null;
    if (panel) {
      panel.style.transform = "";
      panel.style.transition = "";
    }
    backdrop.classList.remove("is-open");
    unlockBodyScroll();
    setTimeout(function () {
      if (!state.sheet) {
        backdrop.hidden = true;
        if (panel) {
          panel.classList.remove("is-add-sheet");
          panel.innerHTML = "";
        }
      }
    }, prefersReducedMotion() ? 0 : 240);
    if (state.lastOpener && typeof state.lastOpener.focus === "function") {
      try { state.lastOpener.focus({ preventScroll: true }); } catch (err) {
        try { state.lastOpener.focus(); } catch (err2) {}
      }
    }
  }

  function openDeleteActionSheet(txId, opener) {
    if (!state.sheet && opener) state.lastOpener = opener;
    var target = state.transactions.find(function (t) { return t.id === txId; });
    if (!target) return;
    state.actionConfirm = {
      txId: txId,
      title: target.title,
      isTransfer: target.type === "transfer" && !!target.groupId
    };
    lockBodyScroll();
    var backdrop = document.getElementById("actionBackdrop");
    var sheet = document.getElementById("actionSheet");
    var msg = state.actionConfirm.isTransfer
      ? "Delete this transfer? This removes both sides of the transfer."
      : 'Delete "' + state.actionConfirm.title + '"?';

    sheet.innerHTML =
      '<div class="action-group">' +
        '<div class="action-msg" id="actionMsg">' + escapeHtml(msg) + "</div>" +
        '<button type="button" class="action-btn is-danger" data-action="action-confirm-delete">Delete</button>' +
      "</div>" +
      '<div class="action-group">' +
        '<button type="button" class="action-btn is-cancel" data-action="action-cancel">Cancel</button>' +
      "</div>";

    backdrop.hidden = false;
    requestAnimationFrame(function () {
      if (!state.actionConfirm) return;
      backdrop.classList.add("is-open");
      var cancelBtn = sheet.querySelector('[data-action="action-cancel"]');
      if (cancelBtn) cancelBtn.focus();
    });
  }

  function closeActionSheet() {
    var backdrop = document.getElementById("actionBackdrop");
    var sheet = document.getElementById("actionSheet");
    state.actionConfirm = null;
    backdrop.classList.remove("is-open");
    unlockBodyScroll();
    setTimeout(function () {
      if (!state.actionConfirm) {
        backdrop.hidden = true;
        if (sheet) sheet.innerHTML = "";
      }
    }, prefersReducedMotion() ? 0 : 240);
  }

  function orderedCategoriesFor(txType) {
    var kind = txType === "income" ? "income" : "expense";
    var list = CATEGORIES.filter(function (c) { return c.kind === kind; });
    if (kind === "income") return list;
    var hour = new Date().getHours();
    var priority = hour < 11
      ? ["food", "transport", "groceries", "shopping"]
      : ["food", "groceries", "transport", "fun"];
    var first = [];
    var rest = [];
    priority.forEach(function (id) {
      var found = list.find(function (c) { return c.id === id; });
      if (found) first.push(found);
    });
    list.forEach(function (c) {
      if (priority.indexOf(c.id) === -1) rest.push(c);
    });
    return { suggested: first, rest: rest };
  }

  function getAddSheetComputed(s) {
    var activeCcy = s.txType === "transfer"
      ? (getAccount(s.fromAccountId) ? getAccount(s.fromAccountId).currency : s.currency)
      : s.currency;
    var parsed = parseInputToMoney(s.rawAmount, activeCcy);
    var isEmpty = !s.rawAmount || parsed.minor === 0;
    var stageDisplay = formatRawAmountStage(s.rawAmount, activeCcy);
    var convertedStage = convert(parsed, otherCurrency(activeCcy), state.rate);
    var convertedText = isEmpty ? "" : ("~ " + formatMoneyRaw(convertedStage));

    var checkAcct = s.txType === "transfer" ? getAccount(s.fromAccountId) : getAccount(s.accountId);
    var isOverdraft = !isEmpty && (s.txType === "expense" || s.txType === "transfer") &&
      checkAcct && parsed.minor > checkAcct.balance.minor;
    var overdraftText = isOverdraft
      ? ("More than " + checkAcct.name + " balance (" + formatMoneyRaw(checkAcct.balance) + ").")
      : "";

    var xferText = "";
    if (s.txType === "transfer") {
      var fromAcct = getAccount(s.fromAccountId);
      var toAcct = getAccount(s.toAccountId);
      if (fromAcct && toAcct && fromAcct.currency !== toAcct.currency) {
        var recv = convert(parsed, toAcct.currency, state.rate);
        xferText = toAcct.name + " receives ~ " + formatMoneyRaw(recv) + " at " + formatRatePair(state.rate);
      }
    }

    var saveLabel = "Enter an amount";
    if (!isEmpty) {
      if (s.txType === "transfer") saveLabel = "Move " + formatMoneyRaw(parsed);
      else if (s.txType === "income") saveLabel = "Save income, " + formatMoneyRaw(parsed);
      else saveLabel = "Save expense, " + formatMoneyRaw(parsed);
    }

    return {
      activeCcy: activeCcy,
      parsed: parsed,
      isEmpty: isEmpty,
      stageDisplay: stageDisplay,
      convertedText: convertedText,
      overdraftText: overdraftText,
      xferText: xferText,
      saveLabel: saveLabel
    };
  }

  function updateAddSheetAmountUI() {
    var s = state.sheet;
    if (!s || s.kind !== "add") return;
    var info = getAddSheetComputed(s);
    var dispEl = document.getElementById("sheetAmountDisplay");
    var convEl = document.getElementById("sheetAmountConverted");
    var warnEl = document.getElementById("sheetOverdraftWarn");
    var xferEl = document.getElementById("sheetXferPreview");
    var saveBtn = document.getElementById("sheetSaveBtn");

    if (dispEl) {
      dispEl.textContent = info.stageDisplay;
      dispEl.classList.toggle("is-empty", info.isEmpty);
    }
    if (convEl) convEl.textContent = info.convertedText;
    if (warnEl) {
      warnEl.textContent = info.overdraftText;
      warnEl.style.display = info.overdraftText ? "block" : "none";
    }
    if (xferEl) xferEl.textContent = info.xferText;
    if (saveBtn) {
      saveBtn.textContent = info.saveLabel;
      saveBtn.disabled = info.isEmpty;
    }
  }

      ? acct.name + " to " + peer.name

      "</div>" +
      '<div style="margin:10px 0 4px;">' +
        '<div class="detail-type-label">' + typeLabel + "</div>" +
        '<div class="detail-amount ' + (isIncome ? "val-inflow" : "") + '">' +
          (isTransfer ? formatMoney(tx.amount) : formatMoney(tx.amount, { showPlus: isIncome })) +
        "</div>" +
        (showConverted ? '<div class="caption tabular">~ ' + formatMoney(convAmt) + " at " + escapeHtml(formatRatePair(state.rate)) + "</div>" : "") +
      "</div>" +
      '<div class="detail-group">' +
        '<div class="detail-row"><span class="caption">Category</span><span>' + escapeHtml(cat.name) + "</span></div>" +
        '<div class="detail-row"><span class="caption">Account</span><span>' + escapeHtml(acctLabel) + "</span></div>" +
        '<div class="detail-row"><span class="caption">Date</span><span>' + escapeHtml(formatShortDate(tx.date)) + "</span></div>" +
        (isTransfer && tx.toAmount ? '<div class="detail-row"><span class="caption">Received</span><span class="tabular">' + formatMoney(tx.toAmount) + "</span></div>" : "") +
        (tx.via === "telegram" ? '<div class="detail-row"><span class="caption">Source</span><span>Added via Telegram</span></div>' : "") +
      "</div>" +
      '<div class="detail-actions">' +
        (!isTransfer ? '<button type="button" class="btn-secondary" data-action="detail-add-again">Add again</button>' : "") +
        '<button type="button" class="btn-text-danger" data-action="detail-ask-delete" data-tx-id="' + escapeHtml(tx.id) + '">Delete</button>' +
      "</div>";
  }

  function renderSheet() {
    var backdrop = document.getElementById("sheetBackdrop");
    var panel = document.getElementById("sheetPanel");
    if (!state.sheet) {
      backdrop.classList.remove("is-open");
      backdrop.hidden = true;
      panel.classList.remove("is-add-sheet");
      panel.innerHTML = "";
      unlockBodyScroll();
      return;
    }

    var wasClosed = backdrop.hidden;
    var prevScrollTop = panel.scrollTop;
    var acctScrolls = [];
    var existingRows = panel.querySelectorAll(".acct-chip-row");
    for (var i = 0; i < existingRows.length; i++) acctScrolls.push(existingRows[i].scrollLeft);
    var catGrid = panel.querySelector(".cat-grid");
    var catScroll = catGrid ? catGrid.scrollLeft : 0;

    var noteEl = document.getElementById("sheetNoteInput");
    var noteFocused = noteEl && document.activeElement === noteEl;
    var selStart = noteFocused ? noteEl.selectionStart : null;
    var selEnd = noteFocused ? noteEl.selectionEnd : null;

    lockBodyScroll();
    backdrop.hidden = false;
    panel.classList.toggle("is-add-sheet", state.sheet.kind === "add");
    panel.innerHTML = state.sheet.kind === "add"
      ? renderAddSheetHtml(state.sheet)
      : renderDetailSheetHtml(state.sheet);
    animateSegThumbs(panel);

    panel.scrollTop = prevScrollTop;
    var newRows = panel.querySelectorAll(".acct-chip-row");
    for (var j = 0; j < newRows.length && j < acctScrolls.length; j++) {
      newRows[j].scrollLeft = acctScrolls[j];
    }
    var newCatGrid = panel.querySelector(".cat-grid");
    if (newCatGrid) newCatGrid.scrollLeft = catScroll;

    if (noteFocused) {
      var restoredNote = document.getElementById("sheetNoteInput");
      if (restoredNote) {
        restoredNote.focus();
        try { restoredNote.setSelectionRange(selStart, selEnd); } catch (err) {}
      }
    }

    if (wasClosed) {
      requestAnimationFrame(function () {
        if (!state.sheet) return;
        backdrop.classList.add("is-open");
        panel.setAttribute("tabindex", "-1");
        panel.focus({ preventScroll: true });
      });
    }
  }

  // Keypad input logic (partial DOM update only)
  function handleKeypadKey(key) {
    if (!state.sheet || state.sheet.kind !== "add") return;
    var s = state.sheet;
    var ccy = s.txType === "transfer"
      ? (getAccount(s.fromAccountId) ? getAccount(s.fromAccountId).currency : s.currency)
      : s.currency;
    var raw = s.rawAmount;

    if (key === "back") {
      s.rawAmount = raw.slice(0, -1);
      updateAddSheetAmountUI();
      return;
    }

    if (ccy === "KHR") {
      if (key === ".") return;
      if (key === "000") {
        if (!raw || raw === "0") return;
        if (raw.length + 3 > 9) return;
        s.rawAmount = raw + "000";
      } else {
        if (raw === "0") raw = "";
        if (raw.length >= 9) return;
        s.rawAmount = raw + key;
      }
    } else {
      if (key === "000") return;
      if (key === ".") {
        if (raw.indexOf(".") !== -1) return;
        s.rawAmount = (raw || "0") + ".";
      } else {
        var dotIdx = raw.indexOf(".");
        if (dotIdx !== -1) {
          if (raw.length - dotIdx - 1 >= 2) return;
          s.rawAmount = raw + key;
        } else {
          if (raw === "0") raw = "";
          if (raw.length >= 6) return;
          s.rawAmount = raw + key;
        }
      }
    }
    updateAddSheetAmountUI();
  }

  // Hero count-up animation
  function animateHeroCountUp() {
    var from = state.animateHeroFrom;
    state.animateHeroFrom = null;
    if (!from || prefersReducedMotion() || state.hideAmounts) return;
    var el = document.getElementById("heroTotalFig");
    if (!el) return;
    var toMoney = selectPockets().totalDisp;
    if (from.currency !== toMoney.currency || from.minor === toMoney.minor) return;

    var startMinor = from.minor;
    var endMinor = toMoney.minor;
    var ccy = toMoney.currency;
    var startTs = null;
    var duration = 340;

    function step(ts) {
      if (!startTs) startTs = ts;
      var t = Math.min(1, (ts - startTs) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      var cur = Math.round(startMinor + (endMinor - startMinor) * eased);
      var curEl = document.getElementById("heroTotalFig");
      if (!curEl || state.hideAmounts) return;
      curEl.textContent = formatMoneyRaw(money(cur, ccy));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Mutations with account reconciliation and Undo
  function showToast(text, undoFn) {
    var toastEl = document.getElementById("toast");
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.undoEntry = undoFn || null;
    toastEl.innerHTML =
      '<span style="display:inline-flex;color:var(--inflow);flex-shrink:0;">' + svgIcon(ICONS.check, 16) + "</span>" +
      '<span class="toast-msg">' + escapeHtml(text) + "</span>" +
      (undoFn ? '<button type="button" class="toast-undo" data-action="toast-undo">Undo</button>' : "");
    toastEl.classList.add("is-visible");
    state.toastTimer = setTimeout(function () {
      toastEl.classList.remove("is-visible");
      state.undoEntry = null;
    }, 5000);
  }

  function applyBalanceDelta(accountId, deltaMinor) {
    var acct = getAccount(accountId);
    if (acct) acct.balance = money(acct.balance.minor + deltaMinor, acct.currency);
  }

  function markHighlightedTx(id) {
    state.highlightedTxId = id;
    setTimeout(function () {
      if (state.highlightedTxId === id) state.highlightedTxId = null;
    }, 1300);
  }

  function saveAddSheet() {
    var s = state.sheet;
    if (!s || s.kind !== "add") return;
    var noteEl = document.getElementById("sheetNoteInput");
    if (noteEl) s.note = noteEl.value.trim();

    var prevHero = selectPockets().totalDisp;

    if (s.txType === "transfer") {
      var fromAcct = getAccount(s.fromAccountId);
      var toAcct = getAccount(s.toAccountId);
      if (!fromAcct || !toAcct || fromAcct.id === toAcct.id) return;
      var parsedFrom = parseInputToMoney(s.rawAmount, fromAcct.currency);
      if (parsedFrom.minor <= 0) return;

      var recvAmt = convert(parsedFrom, toAcct.currency, state.rate);
      var groupId = "tr-" + (state.nextTxSeq++);
      var title = s.note || (fromAcct.name + " to " + toAcct.name);
      var legA = {
        id: "tx-" + (state.nextTxSeq++),
        date: s.date,
        title: title,
        categoryId: "transfer",
        accountId: fromAcct.id,
        peerAccountId: toAcct.id,
        amount: money(-parsedFrom.minor, fromAcct.currency),
        type: "transfer",
        groupId: groupId
      };
      var legB = {
        id: "tx-" + (state.nextTxSeq++),
        date: s.date,
        title: title,
        categoryId: "transfer",
        accountId: toAcct.id,
        peerAccountId: fromAcct.id,
        amount: money(recvAmt.minor, toAcct.currency),
        type: "transfer",
        groupId: groupId
      };

      state.transactions.push(legA, legB);
      applyBalanceDelta(fromAcct.id, -parsedFrom.minor);
      applyBalanceDelta(toAcct.id, recvAmt.minor);
      markHighlightedTx(legA.id);
      state.animateHeroFrom = prevHero;

      closeSheet();
      render();
      haptic();
      showToast("Saved. " + title + ", " + formatMoney(parsedFrom), function () {
        state.animateHeroFrom = selectPockets().totalDisp;
        state.transactions = state.transactions.filter(function (t) { return t.groupId !== groupId; });
        applyBalanceDelta(fromAcct.id, parsedFrom.minor);
        applyBalanceDelta(toAcct.id, -recvAmt.minor);
        render();
      });
      return;
    }

    var acct = getAccount(s.accountId);
    if (!acct) return;
    var parsedAmt = parseInputToMoney(s.rawAmount, s.currency);
    if (parsedAmt.minor <= 0) return;

    var cat = getCategory(s.categoryId);
    var signedMinor = s.txType === "income" ? parsedAmt.minor : -parsedAmt.minor;
    var txTitle = s.note || cat.name;
    var newTx = {
      id: "tx-" + (state.nextTxSeq++),
      date: s.date,
      title: txTitle,
      categoryId: cat.id,
      accountId: acct.id,
      amount: money(signedMinor, s.currency),
      type: s.txType
    };

    state.transactions.push(newTx);
    applyBalanceDelta(acct.id, signedMinor);
    markHighlightedTx(newTx.id);
    state.animateHeroFrom = prevHero;

    closeSheet();
    render();
    haptic();
    showToast("Saved. " + txTitle + ", " + formatMoney(parsedAmt), function () {
      state.animateHeroFrom = selectPockets().totalDisp;
      state.transactions = state.transactions.filter(function (t) { return t.id !== newTx.id; });
      applyBalanceDelta(acct.id, -signedMinor);
      render();
    });
  }

  function performDeleteTx(txId) {
    var target = state.transactions.find(function (t) { return t.id === txId; });
    if (!target) return;

    var prevHero = selectPockets().totalDisp;
    var removed = [];
    if (target.type === "transfer" && target.groupId) {
      removed = state.transactions.filter(function (t) { return t.groupId === target.groupId; });
      state.transactions = state.transactions.filter(function (t) { return t.groupId !== target.groupId; });
    } else {
      removed = [target];
      state.transactions = state.transactions.filter(function (t) { return t.id !== txId; });
    }

    removed.forEach(function (r) {
      applyBalanceDelta(r.accountId, -r.amount.minor);
    });
    state.animateHeroFrom = prevHero;

    closeActionSheet();
    if (state.sheet) closeSheet();
    render();
    haptic();
    showToast("Removed. " + target.title, function () {
      state.animateHeroFrom = selectPockets().totalDisp;
      removed.forEach(function (r) {
        state.transactions.push(r);
        applyBalanceDelta(r.accountId, r.amount.minor);
      });
      render();
    });
  }

  // Main render
  var chartObserver = null;

  function render() {
    renderShell();
    var main = document.getElementById("mainContent");
    var html = "";
    if (state.route === "/") html = renderHomeScreen();
    else if (state.route === "/activity") html = renderActivityScreen();
    else if (state.route === "/accounts") html = renderAccountsScreen();
    else if (state.route === "/budgets") html = renderBudgetsScreen();
    else if (state.route === "/insights") html = renderInsightsScreen();
    else if (state.route === "/settings") html = renderSettingsScreen();

    var animClass = state.navAnim === "push"
      ? " is-push-in"
      : state.navAnim === "pop"
        ? " is-pop-in"
        : "";
    state.navAnim = "fade";

    main.innerHTML = '<div class="screen-view' + animClass + '">' + html + "</div>";
    animateSegThumbs(main);
    updateTopbarScrollState();
    animateHeroCountUp();

    if (state.route === "/insights" && state.insightsPeriod === "6m") {
      renderInsightsCharts();
      var sixHost = document.getElementById("sixMonthChartHost");
      if (sixHost && typeof ResizeObserver === "function") {
        if (chartObserver) chartObserver.disconnect();
        chartObserver = new ResizeObserver(function () {
          if (state.route === "/insights" && state.insightsPeriod === "6m") {
            renderInsightsCharts();
          }
        });
        chartObserver.observe(sixHost);
      }
    } else if (chartObserver) {
      chartObserver.disconnect();
    }
  }

  // Selection updates without full re-render
  function selectDailyDay(day) {
    if (day < 1 || day > CURRENT_DAY) return;
    if (state.selectedDay === day) return;
    state.selectedDay = day;
    var nov = selectNovemberSummary();
    var dObj = nov.dailyTotals[day - 1];
    var lbl = document.getElementById("dailyCalloutLabel");
    var val = document.getElementById("dailyCalloutVal");
    if (lbl && dObj) lbl.textContent = dObj.day + " Nov";
    if (val && dObj) val.textContent = formatMoney(dObj.amount);
    var btns = document.querySelectorAll("#dailyBars .daily-bar-btn");
    for (var i = 0; i < btns.length; i++) {
      var bDay = parseInt(btns[i].getAttribute("data-day"), 10);
      btns[i].classList.toggle("is-selected", bDay === day);
    }
    haptic();
  }

  function selectSixMonthIndex(idx) {
    if (idx < 0 || idx > 5 || state.selectedSixMonthIdx === idx) return;
    state.selectedSixMonthIdx = idx;
    renderInsightsCharts();
    haptic();
  }

  function selectNetWorthIndex(idx) {
    if (idx < 0 || idx > 5 || state.selectedNetWorthIdx === idx) return;
    state.selectedNetWorthIdx = idx;
    renderInsightsCharts();
    haptic();
  }

  // Swipe gestures (sheet dismiss & transaction row swipe-to-delete) & chart scrubbing
  var sheetDrag = null;
  var txSwipe = null;
  var chartScrub = null;
  var openedSwipeRow = null;

  function closeOpenedSwipeRow(exceptWrap) {
    if (openedSwipeRow && openedSwipeRow !== exceptWrap) {
      var r = openedSwipeRow.querySelector(".tx-row");
      if (r) r.style.transform = "";
      openedSwipeRow = null;
    }
  }

  document.addEventListener("pointerdown", function (e) {
    if (e.button && e.button !== 0) return;

    // 1. Sheet handle drag-to-dismiss
    var dragZone = e.target.closest && e.target.closest(".sheet-drag-zone");
    if (dragZone && state.sheet && !e.target.closest("button")) {
      var panel = document.getElementById("sheetPanel");
      if (panel && panel.scrollTop <= 0) {
        sheetDrag = {
          startY: e.clientY,
          lastY: e.clientY,
          startTime: Date.now(),
          dy: 0,
          panel: panel
        };
        panel.style.transition = "none";
        return;
      }
    }

    // 2. Daily bars scrub
    var dailyBars = e.target.closest && e.target.closest("#dailyBars");
    if (dailyBars) {
      chartScrub = { kind: "daily", host: dailyBars };
      return;
    }

    // 3. Insights 6-month / Net worth scrub
    var sixHost = e.target.closest && e.target.closest("#sixMonthChartHost");
    if (sixHost) {
      chartScrub = { kind: "six", host: sixHost };
      return;
    }
    var nwHost = e.target.closest && e.target.closest("#netWorthChartHost");
    if (nwHost) {
      chartScrub = { kind: "nw", host: nwHost };
      return;
    }

    // 4. Transaction row horizontal swipe-to-delete
    var swipeWrap = e.target.closest && e.target.closest(".tx-swipe-wrap");
    if (swipeWrap && !e.target.closest(".tx-swipe-action")) {
      closeOpenedSwipeRow(swipeWrap);
      var row = swipeWrap.querySelector(".tx-row");
      if (row) {
        var currentX = openedSwipeRow === swipeWrap ? -88 : 0;
        txSwipe = {
          wrap: swipeWrap,
          row: row,
          startX: e.clientX,
          startY: e.clientY,
          baseX: currentX,
          dx: 0,
          locked: false,
          cancelled: false
        };
      }
    } else if (!e.target.closest || !e.target.closest(".tx-swipe-action")) {
      closeOpenedSwipeRow(null);
    }
  });

  document.addEventListener("pointermove", function (e) {
    if (sheetDrag) {
      var dy = Math.max(0, e.clientY - sheetDrag.startY);
      sheetDrag.dy = dy;
      sheetDrag.lastY = e.clientY;
      sheetDrag.panel.style.transform = "translateY(" + dy + "px)";
      var shell = document.getElementById("appShell");
      if (shell && !prefersReducedMotion() && !(window.matchMedia && window.matchMedia("(min-width: 1024px)").matches)) {
        var progress = Math.min(1, dy / 360);
        var scale = 0.93 + 0.07 * progress;
        var ty = 10 * (1 - progress);
        shell.style.transform = "translateY(" + ty.toFixed(1) + "px) scale(" + scale.toFixed(4) + ")";
      }
      return;
    }

    if (chartScrub) {
      var rect = chartScrub.host.getBoundingClientRect();
      var rel = Math.max(0, Math.min(0.999, (e.clientX - rect.left) / Math.max(1, rect.width)));
      if (chartScrub.kind === "daily") {
        var day = Math.min(CURRENT_DAY, Math.max(1, Math.floor(rel * MONTH_DAYS) + 1));
        selectDailyDay(day);
      } else if (chartScrub.kind === "six") {
        selectSixMonthIndex(Math.min(5, Math.max(0, Math.floor(rel * 6))));
      } else if (chartScrub.kind === "nw") {
        selectNetWorthIndex(Math.min(5, Math.max(0, Math.floor(rel * 6))));
      }
      return;
    }

    if (txSwipe && !txSwipe.cancelled) {
      var dx = e.clientX - txSwipe.startX;
      var dySwipe = e.clientY - txSwipe.startY;
      if (!txSwipe.locked) {
        if (Math.abs(dySwipe) > 10 && Math.abs(dySwipe) >= Math.abs(dx)) {
          txSwipe.cancelled = true;
          return;
        }
        if (Math.abs(dx) > 10 && Math.abs(dx) - Math.abs(dySwipe) > 8) {
          txSwipe.locked = true;
          txSwipe.row.style.transition = "none";
        } else {
          return;
        }
      }
      var nextX = Math.max(-88, Math.min(0, txSwipe.baseX + dx));
      txSwipe.dx = nextX;
      txSwipe.row.style.transform = "translateX(" + nextX + "px)";
    }
  });

  function finishPointerGestures() {
    if (sheetDrag) {
      var elapsed = Math.max(1, Date.now() - sheetDrag.startTime);
      var vel = sheetDrag.dy / elapsed;
      sheetDrag.panel.style.transition = "";
      if (sheetDrag.dy > 90 || (sheetDrag.dy > 40 && vel > 0.45)) {
        sheetDrag = null;
        closeSheet();
      } else {
        sheetDrag.panel.style.transform = "";
        var shell = document.getElementById("appShell");
        if (shell) {
          shell.style.transform = "";
          shell.style.borderRadius = "";
        }
        sheetDrag = null;
      }
    }

    if (txSwipe) {
      if (txSwipe.locked) {
        txSwipe.row.style.transition = "";
        if (txSwipe.dx <= -44) {
          txSwipe.row.style.transform = "translateX(-88px)";
          openedSwipeRow = txSwipe.wrap;
        } else {
          txSwipe.row.style.transform = "";
          if (openedSwipeRow === txSwipe.wrap) openedSwipeRow = null;
        }
        txSwipe.row.setAttribute("data-just-swiped", "1");
        setTimeout((function (r) { return function () { r.removeAttribute("data-just-swiped"); }; })(txSwipe.row), 220);
      }
      txSwipe = null;
    }

    chartScrub = null;
  }

  document.addEventListener("pointerup", finishPointerGestures);
  document.addEventListener("pointercancel", finishPointerGestures);

  // Event delegation on document
  document.addEventListener("click", function (e) {
    var target = e.target;
    activateSearchFocus(target);
    if (target === document.getElementById("sheetBackdrop")) {
      closeSheet();
      return;
    }
    if (target === document.getElementById("actionBackdrop")) {
      closeActionSheet();
      return;
    }

    if (state.datePopoverOpen && !target.closest(".date-popover-anchor")) {
      state.datePopoverOpen = false;
      renderSheet();
      return;
    }

    // 6-month / Net worth chart group clicks
    var barGroup = target.closest && target.closest(".month-bar-group");
    if (barGroup) {
      selectSixMonthIndex(parseInt(barGroup.getAttribute("data-month-idx"), 10));
      return;
    }
    var nwGroup = target.closest && target.closest(".nw-point-hit");
    if (nwGroup) {
      selectNetWorthIndex(parseInt(nwGroup.getAttribute("data-nw-idx"), 10));
      return;
    }

    var el = target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");

    if (action === "open-detail" && el.getAttribute("data-just-swiped") === "1") {
      return;
    }
    if (action === "open-detail" && openedSwipeRow && openedSwipeRow.contains(el)) {
      closeOpenedSwipeRow(null);
      return;
    }

    if (action === "nav") {
      navigate(el.getAttribute("data-route"));
    } else if (action === "go-back") {
      navigate(state.prevMainRoute || "/");
    } else if (action === "go-settings-rate") {
      navigate("/settings", { scrollToId: "settingsRateSection" });
    } else if (action === "open-account-activity") {
      state.activityAccountId = el.getAttribute("data-acct-id");
      navigate("/activity");
    } else if (action === "clear-activity-account") {
      state.activityAccountId = null;
      render();
    } else if (action === "cycle-theme") {
      var nextTheme = effectiveTheme() === "dark" ? "light" : "dark";
      state.themePref = nextTheme;
      writeStorage(STORAGE_THEME_KEY, nextTheme);
      applyTheme();
      renderShell();
      if (state.route === "/" || state.route === "/settings") render();
      haptic();
    } else if (action === "toggle-hide") {
      state.hideAmounts = !state.hideAmounts;
      writeStorage(STORAGE_HIDE_KEY, state.hideAmounts ? "1" : "0");
      render();
      haptic();
    } else if (action === "set-theme") {
      var t = el.getAttribute("data-theme");
      state.pendingSegSlides["settings-theme"] = state.themePref === "light" ? 0 : state.themePref === "dark" ? 1 : 2;
      state.themePref = t;
      writeStorage(STORAGE_THEME_KEY, t);
      applyTheme();
      render();
      haptic();
    } else if (action === "set-currency") {
      var ccy = el.getAttribute("data-currency");
      if (ccy === "USD" || ccy === "KHR") {
        var prevCcyIdx = state.displayCurrency === "KHR" ? 1 : 0;
        state.pendingSegSlides["hero-currency"] = prevCcyIdx;
        state.pendingSegSlides["settings-currency"] = prevCcyIdx;
        state.displayCurrency = ccy;
        writeStorage(STORAGE_CURRENCY_KEY, ccy);
        render();
        haptic();
      }
    } else if (action === "month-prev") {
      state.monthCursor = 0;
      render();
    } else if (action === "month-next") {
      state.monthCursor = 1;
      render();
    } else if (action === "select-day") {
      selectDailyDay(parseInt(el.getAttribute("data-day"), 10));
    } else if (action === "activity-type") {
      state.activityType = el.getAttribute("data-type");
      render();
    } else if (action === "activity-ccy") {
      var c = el.getAttribute("data-ccy");
      if (c === "USD") state.activityCcyUsd = !state.activityCcyUsd;
      if (c === "KHR") state.activityCcyKhr = !state.activityCcyKhr;
      render();
    } else if (action === "clear-activity-search") {
      state.activitySearch = "";
      render();
      var sInp = document.getElementById("activitySearch");
      if (sInp) sInp.focus();
    } else if (action === "cancel-activity-search") {
      state.activitySearch = "";
      state.activitySearchFocused = false;
      render();
    } else if (action === "clear-activity-filters") {
      state.activitySearch = "";
      state.activitySearchFocused = false;
      state.activityType = "all";
      state.activityCcyUsd = false;
      state.activityCcyKhr = false;
      state.activityAccountId = null;
      render();
    } else if (action === "insights-period") {
      state.pendingSegSlides["insights-period"] = state.insightsPeriod === "6m" ? 1 : 0;
      state.insightsPeriod = el.getAttribute("data-period");
      state.selectedInsightCat = null;
      render();
    } else if (action === "insight-cat") {
      var catId = el.getAttribute("data-cat-id");
      state.selectedInsightCat = state.selectedInsightCat === catId ? null : catId;
      render();
    } else if (action === "reset-rate") {
      state.rate = PUBLISHED_RATE;
      state.isCustomRate = false;
      render();
      showToast("Rate reset to " + formatRatePair(PUBLISHED_RATE));
    } else if (action === "toggle-stale-rate") {
      state.staleRatePreview = !state.staleRatePreview;
      render();
    } else if (action === "open-add") {
      openAddSheet(el);
    } else if (action === "add-again") {
      var idx = parseInt(el.getAttribute("data-preset-idx"), 10);
      var presets = selectAddAgainItems();
      if (presets[idx]) {
        openAddPrefilled({
          txType: "expense",
          amount: presets[idx].amount,
          accountId: presets[idx].accountId,
          categoryId: presets[idx].categoryId,
          note: presets[idx].note
        }, el);
      }
    } else if (action === "open-detail") {
      openDetailSheet(el.getAttribute("data-tx-id"), el);
    } else if (action === "swipe-delete") {
      closeOpenedSwipeRow(null);
      openDeleteActionSheet(el.getAttribute("data-tx-id"), el);
    } else if (action === "close-sheet") {
      closeSheet();
    } else if (action === "sheet-type") {
      var tp = el.getAttribute("data-type");
      if (state.sheet && state.sheet.kind === "add") {
        state.pendingSegSlides["sheet-type"] = state.sheet.txType === "expense" ? 0 : state.sheet.txType === "income" ? 1 : 2;
        state.sheet.txType = tp;
        if (tp === "income") state.sheet.categoryId = "salary";
        else if (tp === "expense") state.sheet.categoryId = "food";
        else if (tp === "transfer") {
          var pair = transferDefaultPair();
          state.sheet.fromAccountId = pair.fromId;
          state.sheet.toAccountId = pair.toId;
        }
        renderSheet();
        haptic();
      }
    } else if (action === "sheet-flip-ccy") {
      if (state.sheet && state.sheet.kind === "add") {
        var newCcy = state.sheet.currency === "USD" ? "KHR" : "USD";
        state.sheet.currency = newCcy;
        state.sheet.rawAmount = "";
        state.sheet.accountId = defaultAccountForCurrency(newCcy);
        if (!state.shownCurrencyHint) {
          state.sheet.currencyHintVisible = true;
          state.shownCurrencyHint = true;
        }
        state.sheet.fadeAccounts = true;
        renderSheet();
        haptic();
        setTimeout(function () {
          if (state.sheet && state.sheet.kind === "add") {
            state.sheet.fadeAccounts = false;
            var row = document.querySelector(".acct-chip-row");
            if (row) row.style.opacity = "1";
          }
        }, 120);
      }
    } else if (action === "sheet-acct") {
      if (state.sheet && state.sheet.kind === "add") {
        state.sheet.accountId = el.getAttribute("data-acct-id");
        renderSheet();
      }
    } else if (action === "sheet-from-acct") {
      if (state.sheet && state.sheet.kind === "add") {
        var id = el.getAttribute("data-acct-id");
        if (id !== state.sheet.toAccountId) {
          var prevCcy = getAccount(state.sheet.fromAccountId).currency;
          var nextCcy = getAccount(id).currency;
          state.sheet.fromAccountId = id;
          if (prevCcy !== nextCcy) state.sheet.rawAmount = "";
          renderSheet();
        }
      }
    } else if (action === "sheet-to-acct") {
      if (state.sheet && state.sheet.kind === "add") {
        var tid = el.getAttribute("data-acct-id");
        if (tid !== state.sheet.fromAccountId) {
          state.sheet.toAccountId = tid;
          renderSheet();
        }
      }
    } else if (action === "sheet-cat") {
      if (state.sheet && state.sheet.kind === "add") {
        state.sheet.categoryId = el.getAttribute("data-cat-id");
        renderSheet();
      }
    } else if (action === "toggle-date-popover") {
      if (state.sheet && state.sheet.kind === "add") {
        state.datePopoverOpen = !state.datePopoverOpen;
        renderSheet();
      }
    } else if (action === "sheet-date") {
      if (state.sheet && state.sheet.kind === "add") {
        state.sheet.date = el.getAttribute("data-date");
        state.datePopoverOpen = false;
        renderSheet();
      }
    } else if (action === "keypad") {
      handleKeypadKey(el.getAttribute("data-key"));
      haptic();
    } else if (action === "sheet-save") {
      saveAddSheet();
    } else if (action === "detail-add-again") {
      if (state.sheet && state.sheet.kind === "detail") {
        var logical = selectLogicalTransactions();
        var tx = logical.find(function (t) { return t.id === state.sheet.txId; });
        if (tx && tx.type !== "transfer") {
          openAddPrefilled({
            txType: tx.type,
            amount: money(Math.abs(tx.amount.minor), tx.amount.currency),
            accountId: tx.accountId,
            categoryId: tx.categoryId,
            note: tx.title
          }, state.lastOpener);
        }
      }
    } else if (action === "detail-ask-delete") {
      var delId = el.getAttribute("data-tx-id") || (state.sheet && state.sheet.txId);
      if (delId) openDeleteActionSheet(delId, el);
    } else if (action === "action-confirm-delete") {
      if (state.actionConfirm) performDeleteTx(state.actionConfirm.txId);
    } else if (action === "action-cancel") {
      closeActionSheet();
    } else if (action === "toast-undo") {
      if (state.undoEntry) {
        var fn = state.undoEntry;
        state.undoEntry = null;
        if (state.toastTimer) clearTimeout(state.toastTimer);
        document.getElementById("toast").classList.remove("is-visible");
        fn();
        haptic();
      }
    }
  });

  function activateSearchFocus(target) {
    if (target && target.id === "activitySearch") {
      state.activitySearchFocused = true;
      var sr = document.getElementById("searchRow");
      if (sr) sr.classList.add("is-focused");
    }
  }

  document.addEventListener("focus", function (e) {
    activateSearchFocus(e.target);
  }, true);

  document.addEventListener("focusin", function (e) {
    activateSearchFocus(e.target);
    var g = e.target.closest && e.target.closest(".month-bar-group");
    if (g) {
      var idx = parseInt(g.getAttribute("data-month-idx"), 10);
      if (!isNaN(idx)) selectSixMonthIndex(idx);
    }
  });

  document.addEventListener("focusout", function (e) {
    if (e.target && e.target.id === "activitySearch") {
      setTimeout(function () {
        var inp = document.getElementById("activitySearch");
        if (!inp || document.activeElement !== inp) {
          state.activitySearchFocused = false;
          var sr = document.getElementById("searchRow");
          if (sr && !state.activitySearch) sr.classList.remove("is-focused");
        }
      }, 120);
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.id === "activitySearch") {
      state.activitySearch = e.target.value;
      var pos = e.target.selectionStart;
      render();
      var restored = document.getElementById("activitySearch");
      if (restored) {
        restored.focus();
        try { restored.setSelectionRange(pos, pos); } catch (err) {}
      }
    } else if (e.target.id === "sheetNoteInput" && state.sheet && state.sheet.kind === "add") {
      state.sheet.note = e.target.value;
    } else if (e.target.id === "sheetDateInput" && state.sheet && state.sheet.kind === "add") {
      if (e.target.value) {
        state.sheet.date = e.target.value;
        state.datePopoverOpen = false;
        renderSheet();
      }
    }
  });

  document.addEventListener("submit", function (e) {
    if (e.target.id === "rateForm") {
      e.preventDefault();
      var input = document.getElementById("customRateInput");
      var errEl = document.getElementById("rateError");
      var rawVal = (input.value || "").replace(/[^0-9]/g, "");
      var val = parseInt(rawVal, 10);
      if (!val || val < 3000 || val > 6000) {
        if (errEl) {
          errEl.textContent = "Enter a rate between 3,000 and 6,000 riel per dollar.";
          errEl.style.display = "block";
        }
        return;
      }
      state.rate = val;
      state.isCustomRate = true;
      render();
      showToast("Rate updated to " + formatRatePair(val));
    }
  });

  // Keyboard shortcuts and focus trap
  document.addEventListener("keydown", function (e) {
    if (state.actionConfirm) {
      if (e.key === "Escape") {
        e.preventDefault();
        closeActionSheet();
      }
      return;
    }

    if (state.sheet) {
      if (e.key === "Escape") {
        e.preventDefault();
        if (state.datePopoverOpen) {
          state.datePopoverOpen = false;
          renderSheet();
        } else {
          closeSheet();
        }
        return;
      }
      if (e.key === "Tab") {
        var panel = document.getElementById("sheetPanel");
        var focusable = panel.querySelectorAll('button:not(:disabled), input:not(:disabled), [tabindex="0"]');
        if (focusable.length > 0) {
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
        return;
      }
      if (state.sheet.kind === "add") {
        var activeTag = document.activeElement ? document.activeElement.tagName : "";
        if (activeTag === "INPUT") {
          if (e.key === "Enter" && document.activeElement.id === "sheetNoteInput") {
            e.preventDefault();
            saveAddSheet();
          }
          return;
        }
        if (/^[0-9]$/.test(e.key)) {
          e.preventDefault();
          handleKeypadKey(e.key);
        } else if (e.key === ".") {
          e.preventDefault();
          handleKeypadKey(".");
        } else if (e.key === "Backspace") {
          e.preventDefault();
          handleKeypadKey("back");
        } else if (e.key === "Enter") {
          e.preventDefault();
          saveAddSheet();
        }
      }
      return;
    }

    var tag = document.activeElement ? document.activeElement.tagName : "";
    if (tag !== "INPUT" && tag !== "TEXTAREA" && (e.key === "n" || e.key === "N") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      openAddSheet(document.activeElement);
    }
  });

  window.addEventListener("scroll", onWindowScroll, { passive: true });

  window.addEventListener("hashchange", function () {
    state.route = parseHashRoute();
    state.lastScrollY = 0;
    state.scrollAnchorY = 0;
    state.scrollDir = 0;
    setDockCollapsed(false);
    window.scrollTo(0, 0);
    render();
  });

  if (window.matchMedia) {
    var mqDesktop = window.matchMedia("(min-width: 1024px)");
    var mqDark = window.matchMedia("(prefers-color-scheme: dark)");
    var mqReduced = window.matchMedia("(prefers-reduced-motion: reduce)");
    if (mqDesktop.addEventListener) mqDesktop.addEventListener("change", function () {
      setDockCollapsed(false);
      render();
    });
    if (mqDark.addEventListener) mqDark.addEventListener("change", function () {
      updateThemeColorMeta();
      renderShell();
    });
    if (mqReduced.addEventListener) mqReduced.addEventListener("change", function () {
      if (mqReduced.matches) setDockCollapsed(false);
    });
  }

  render();
})();
</script>
</body>
</html>
